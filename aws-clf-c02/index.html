window.QDATA[3] = [
{t:"VPC",q:"Quel composant permet aux ressources d'un VPC de communiquer avec internet ?",o:["Une Internet Gateway","Un security group","Une NACL","Un VPC endpoint"],a:[0],e:["L'Internet Gateway est la porte d'entrée et de sortie internet du VPC.","Un security group filtre, il ne connecte pas.","Une NACL filtre, elle ne connecte pas.","Un VPC endpoint relie à des services AWS sans passer par internet."]},
{t:"VPC",q:"Des instances dans un sous-réseau privé doivent télécharger des mises à jour sur internet sans être joignables de l'extérieur. Quel composant utiliser ?",o:["Une NAT Gateway","Une Internet Gateway attachée au sous-réseau privé","AWS Direct Connect","Amazon Route 53"],a:[0],e:["La NAT Gateway autorise le trafic sortant uniquement.","Une route vers l'Internet Gateway rendrait le sous-réseau public.","Direct Connect relie à un datacenter, pas à internet.","Route 53 est un DNS."]},
{t:"VPC",q:"Qu'est-ce qui distingue un sous-réseau public d'un sous-réseau privé ?",o:["Le sous-réseau public a une route vers une Internet Gateway","Le sous-réseau public est gratuit","Le sous-réseau privé n'a pas d'adresses IP","Le sous-réseau public couvre plusieurs AZ"],a:[0],e:["C'est la table de routage vers l'IGW qui rend un sous-réseau public.","Aucune différence de prix.","Les deux ont des adresses IP privées.","Tout sous-réseau est dans une seule AZ."]},
{t:"VPC",q:"À quel niveau un security group s'applique-t-il ?",o:["Au niveau de l'instance (interface réseau)","Au niveau du sous-réseau","Au niveau de la région","Au niveau du compte"],a:[0],e:["Le security group est un pare-feu attaché à l'instance.","Le niveau sous-réseau, c'est la NACL.","Il ne s'applique pas à une région.","Il ne s'applique pas à un compte."]},
{t:"VPC",q:"Une entreprise doit bloquer explicitement une adresse IP malveillante pour tout un sous-réseau. Quel outil utiliser ?",o:["Une Network ACL","Un security group","AWS Shield Standard","Amazon Inspector"],a:[0],e:["La NACL accepte des règles de refus explicite au niveau du sous-réseau.","Un security group n'a que des règles d'autorisation.","Shield protège des attaques DDoS.","Inspector recherche des vulnérabilités."]},
{t:"VPC",q:"Quelle affirmation sur les security groups est correcte ?",o:["Ils sont stateful : la réponse à une requête autorisée est automatiquement permise","Ils sont stateless : il faut autoriser l'aller et le retour","Ils peuvent contenir des règles de refus","Ils s'appliquent à un sous-réseau entier"],a:[0],e:["Le security group mémorise les connexions (stateful).","Stateless décrit la NACL.","Les security groups n'ont que des autorisations.","Le niveau sous-réseau correspond à la NACL."]},
{t:"VPC",q:"Quelles caractéristiques s'appliquent aux Network ACL ? (2 réponses)",o:["Elles sont stateless","Elles prennent en charge les règles d'autorisation et de refus","Elles s'attachent à une instance EC2","Elles sont stateful","Elles ne prennent en charge que les règles d'autorisation"],a:[0,1],e:["Il faut autoriser explicitement le trafic de retour.","Les NACL peuvent autoriser et refuser.","Elles s'attachent à un sous-réseau.","Stateful décrit les security groups.","Les règles d'autorisation seules, c'est le security group."]},
{t:"VPC",q:"Quel service évalue l'accessibilité réseau des instances EC2 et signale les ports exposés inutilement ?",o:["Amazon Inspector","AWS Shield","Amazon Macie","AWS Artifact"],a:[0],e:["Inspector analyse les vulnérabilités et l'exposition réseau.","Shield protège contre les DDoS.","Macie détecte les données sensibles dans S3.","Artifact fournit des rapports de conformité."]},
{t:"Connectivité",q:"Une entreprise veut connecter rapidement et à moindre coût son datacenter à son VPC, via une connexion chiffrée sur internet. Quel service choisir ?",o:["AWS Site-to-Site VPN","AWS Direct Connect","AWS Client VPN","VPC Peering"],a:[0],e:["Le VPN site à site se met en place en quelques minutes via internet.","Direct Connect est une liaison dédiée qui prend des semaines.","Client VPN connecte des utilisateurs individuels.","Le peering relie deux VPC."]},
{t:"Connectivité",q:"Une entreprise a besoin d'une connexion privée dédiée vers AWS, avec une bande passante constante, qui ne passe pas par internet. Quel service choisir ?",o:["AWS Direct Connect","AWS Site-to-Site VPN","Amazon CloudFront","AWS Global Accelerator"],a:[0],e:["Direct Connect est une liaison physique privée dédiée.","Le VPN passe par internet, donc débit variable.","CloudFront est un CDN.","Global Accelerator optimise le trafic des utilisateurs internet."]},
{t:"Connectivité",q:"Des employés en télétravail doivent se connecter de façon sécurisée au VPC de l'entreprise depuis leur ordinateur. Quel service choisir ?",o:["AWS Client VPN","AWS Site-to-Site VPN","AWS Direct Connect","AWS Transit Gateway"],a:[0],e:["Client VPN connecte des utilisateurs individuels.","Le VPN site à site relie des réseaux entiers.","Direct Connect relie un datacenter.","Transit Gateway interconnecte des réseaux."]},
{t:"Connectivité",q:"Une entreprise doit interconnecter 50 VPC et plusieurs sites sur site via un point central. Quel service simplifie cette architecture ?",o:["AWS Transit Gateway","VPC Peering entre chaque paire","Une NAT Gateway","Amazon Route 53"],a:[0],e:["Transit Gateway fonctionne en étoile (hub) et évite un maillage complexe.","Le peering n'est pas transitif : il faudrait des centaines de liaisons.","La NAT Gateway sert à sortir sur internet.","Route 53 est un DNS."]},
{t:"Connectivité",q:"Le VPC A est appairé au VPC B, et le VPC B au VPC C. Le VPC A peut-il joindre le VPC C via B ?",o:["Non, le VPC peering n'est pas transitif","Oui, automatiquement","Oui, si les VPC sont dans la même région","Oui, avec une Internet Gateway"],a:[0],e:["Il faut un peering direct A-C ou un Transit Gateway.","Le peering n'est jamais transitif.","La région ne change pas cette règle.","Une IGW ne rend pas le peering transitif."]},
{t:"Connectivité",q:"Une entreprise veut accéder à Amazon S3 depuis son VPC sans que le trafic passe par internet. Quelle solution utiliser ?",o:["Un VPC endpoint (AWS PrivateLink / endpoint de passerelle)","Une NAT Gateway","Une Internet Gateway","AWS Client VPN"],a:[0],e:["Un VPC endpoint relie le VPC aux services AWS en privé.","La NAT Gateway passe par internet.","L'IGW est la voie internet.","Client VPN connecte des utilisateurs au VPC."]},
{t:"Route 53",q:"Quelles fonctions offre Amazon Route 53 ? (2 réponses)",o:["Service DNS et enregistrement de noms de domaine","Contrôles de santé et routage de basculement (failover)","Mise en cache de contenu statique","Pare-feu applicatif","Stockage objet"],a:[0,1],e:["Route 53 est un DNS managé qui vend aussi des domaines.","Il surveille les points de terminaison et bascule en cas de panne.","Le cache, c'est CloudFront.","Le pare-feu applicatif, c'est WAF.","Le stockage objet, c'est S3."]},
{t:"Route 53",q:"Une entreprise veut diriger chaque utilisateur vers la région AWS qui lui répond le plus vite. Quelle politique de routage Route 53 choisir ?",o:["Routage basé sur la latence","Routage simple","Routage pondéré","Routage par basculement"],a:[0],e:["Le routage par latence renvoie la région la plus rapide pour l'utilisateur.","Le routage simple renvoie toujours la même réponse.","Le pondéré répartit selon des pourcentages.","Le basculement sert à rediriger en cas de panne."]},
{t:"Route 53",q:"Une équipe veut envoyer 10 % du trafic vers une nouvelle version de son application pour la tester. Quelle politique Route 53 utiliser ?",o:["Routage pondéré","Routage par géolocalisation","Routage par latence","Routage simple"],a:[0],e:["Le routage pondéré répartit le trafic selon des pourcentages.","La géolocalisation route selon le pays de l'utilisateur.","La latence route vers la région la plus rapide.","Le routage simple ne fait pas de répartition."]},
{t:"Route 53",q:"Un site doit afficher un contenu différent aux utilisateurs situés en France, pour des raisons de licence. Quelle politique Route 53 choisir ?",o:["Routage par géolocalisation","Routage pondéré","Routage par latence","Routage multivaleur"],a:[0],e:["La géolocalisation route selon la localisation de l'utilisateur.","Le pondéré ne tient pas compte du pays.","La latence ne garantit pas le pays.","Le multivaleur renvoie plusieurs IP saines."]},
{t:"Périphérie",q:"Un site d'actualités veut accélérer l'affichage de ses images et vidéos pour des lecteurs du monde entier. Quel service choisir ?",o:["Amazon CloudFront","AWS Direct Connect","Amazon Route 53 seul","AWS Transit Gateway"],a:[0],e:["CloudFront met en cache le contenu au plus près des lecteurs.","Direct Connect relie un datacenter à AWS.","Route 53 ne met rien en cache.","Transit Gateway interconnecte des réseaux."]},
{t:"Périphérie",q:"Un jeu en ligne utilise UDP et a besoin de deux adresses IP fixes mondiales et d'un chemin réseau optimisé. Quel service choisir ?",o:["AWS Global Accelerator","Amazon CloudFront","Amazon API Gateway","AWS Site-to-Site VPN"],a:[0],e:["Global Accelerator fournit des IP fixes et fait passer le trafic par le réseau AWS, sans cache.","CloudFront met en cache du contenu HTTP.","API Gateway gère des API.","Le VPN relie des réseaux."]},
{t:"Périphérie",q:"Quelle différence clé existe entre CloudFront et Global Accelerator ?",o:["CloudFront met le contenu en cache, Global Accelerator non","Global Accelerator met le contenu en cache, CloudFront non","Les deux sont des DNS","Les deux remplacent Direct Connect"],a:[0],e:["CloudFront est un CDN avec cache ; Global Accelerator optimise le routage réseau.","C'est l'inverse.","Le DNS, c'est Route 53.","Aucun des deux ne remplace une liaison dédiée."]},
{t:"Périphérie",q:"Une équipe veut créer, publier, sécuriser et limiter le nombre d'appels à une API REST qui déclenche des fonctions Lambda. Quel service utiliser ?",o:["Amazon API Gateway","Amazon CloudFront","Elastic Load Balancing","AWS AppSync uniquement pour REST"],a:[0],e:["API Gateway gère le cycle de vie complet des API.","CloudFront est un CDN.","Un load balancer répartit le trafic sans gérer les API.","AppSync sert aux API GraphQL."]},
{t:"IA/ML",q:"Une entreprise veut analyser des photos pour détecter des visages et des objets. Quel service choisir ?",o:["Amazon Rekognition","Amazon Textract","Amazon Polly","Amazon Comprehend"],a:[0],e:["Rekognition analyse les images et vidéos.","Textract extrait du texte de documents.","Polly convertit du texte en voix.","Comprehend analyse du texte."]},
{t:"IA/ML",q:"Une compagnie d'assurance veut extraire automatiquement les champs de formulaires et de factures scannés. Quel service choisir ?",o:["Amazon Textract","Amazon Rekognition","Amazon Translate","Amazon Lex"],a:[0],e:["Textract extrait texte, formulaires et tableaux des documents.","Rekognition reconnaît des visages et objets, pas la structure de formulaires.","Translate traduit.","Lex crée des chatbots."]},
{t:"IA/ML",q:"Une marque veut savoir si les avis de ses clients sont positifs ou négatifs. Quel service choisir ?",o:["Amazon Comprehend","Amazon Transcribe","Amazon Polly","Amazon Kendra"],a:[0],e:["Comprehend fait de l'analyse de sentiment sur du texte.","Transcribe convertit la voix en texte.","Polly convertit le texte en voix.","Kendra est un moteur de recherche d'entreprise."]},
{t:"IA/ML",q:"Un centre d'appels veut convertir automatiquement les enregistrements audio en texte. Quel service choisir ?",o:["Amazon Transcribe","Amazon Polly","Amazon Translate","Amazon Textract"],a:[0],e:["Transcribe fait de la reconnaissance vocale (voix vers texte).","Polly fait l'inverse : texte vers voix.","Translate traduit du texte.","Textract lit des documents."]},
{t:"IA/ML",q:"Un site d'actualités veut proposer une version audio de ses articles. Quel service choisir ?",o:["Amazon Polly","Amazon Transcribe","Amazon Comprehend","Amazon Rekognition"],a:[0],e:["Polly synthétise une voix à partir de texte.","Transcribe convertit la voix en texte.","Comprehend analyse le sens d'un texte.","Rekognition analyse des images."]},
{t:"IA/ML",q:"Une entreprise veut créer un chatbot vocal et textuel pour son service client. Quel service choisir ?",o:["Amazon Lex","Amazon Polly","Amazon Kendra","Amazon Comprehend"],a:[0],e:["Lex construit des interfaces conversationnelles (la technologie d'Alexa).","Polly ne fait que synthétiser la voix.","Kendra recherche dans des documents.","Comprehend analyse du texte mais ne converse pas."]},
{t:"IA/ML",q:"Une entreprise veut un moteur de recherche intelligent sur ses documents internes (wikis, PDF, intranet). Quel service choisir ?",o:["Amazon Kendra","Amazon Athena","Amazon Translate","Amazon Textract"],a:[0],e:["Kendra est un service de recherche d'entreprise basé sur le machine learning.","Athena interroge des données en SQL dans S3.","Translate traduit.","Textract extrait du texte mais ne fait pas de recherche."]},
{t:"IA/ML",q:"Une équipe de data scientists veut construire, entraîner et déployer ses propres modèles de machine learning. Quel service choisir ?",o:["Amazon SageMaker AI","Amazon Rekognition","Amazon Lex","Amazon QuickSight"],a:[0],e:["SageMaker AI est la plateforme complète pour des modèles sur mesure.","Rekognition est un modèle prêt à l'emploi pour les images.","Lex sert aux chatbots.","QuickSight fait des tableaux de bord."]},
{t:"IA/ML",q:"Un site e-commerce doit être disponible en 12 langues. Quel service automatise la traduction ?",o:["Amazon Translate","Amazon Transcribe","Amazon Polly","Amazon Comprehend"],a:[0],e:["Translate fait de la traduction automatique.","Transcribe convertit la voix en texte.","Polly convertit le texte en voix.","Comprehend analyse le texte."]},
{t:"IA/ML",q:"Quel service d'IA générative d'AWS aide les employés à obtenir des réponses à partir des données de l'entreprise et aide les développeurs à coder ?",o:["Amazon Q","Amazon Kendra","Amazon Lex","Amazon Athena"],a:[0],e:["Amazon Q (Business et Developer) est l'assistant d'IA générative d'AWS.","Kendra est un moteur de recherche, pas un assistant génératif.","Lex construit des chatbots personnalisés.","Athena est un service de requêtes SQL."]},
{t:"Analytique",q:"Une équipe veut interroger en SQL des fichiers de logs stockés dans S3, sans charger les données dans une base et sans serveur. Quel service choisir ?",o:["Amazon Athena","Amazon Redshift","Amazon RDS","Amazon Kinesis"],a:[0],e:["Athena exécute du SQL directement sur S3, à la demande.","Redshift demande de charger les données dans un entrepôt.","RDS demande de charger les données dans une base.","Kinesis traite des flux en temps réel."]},
{t:"Analytique",q:"Une entreprise doit collecter et traiter en temps réel des millions d'événements de clics sur son site. Quel service choisir ?",o:["Amazon Kinesis","Amazon Athena","AWS Glue","Amazon S3 Glacier"],a:[0],e:["Kinesis est fait pour les flux de données en temps réel.","Athena interroge des données déjà stockées.","Glue fait de l'ETL par lots.","Glacier sert à l'archivage."]},
{t:"Analytique",q:"Avant l'analyse, des données doivent être extraites, nettoyées et transformées automatiquement, sans serveur. Quel service choisir ?",o:["AWS Glue","Amazon QuickSight","Amazon Kinesis","Amazon Neptune"],a:[0],e:["Glue est le service ETL sans serveur d'AWS, avec un catalogue de données.","QuickSight visualise des données.","Kinesis ingère des flux temps réel.","Neptune est une base graphe."]},
{t:"Analytique",q:"La direction veut des tableaux de bord interactifs de business intelligence. Quel service choisir ?",o:["Amazon QuickSight","Amazon Athena","AWS Glue","Amazon EMR"],a:[0],e:["QuickSight est le service de BI et de tableaux de bord.","Athena exécute des requêtes, sans tableaux de bord.","Glue prépare les données.","EMR traite du big data."]},
{t:"Analytique",q:"Une entreprise veut exécuter des traitements Apache Spark et Hadoop sur de très gros volumes. Quel service managé choisir ?",o:["Amazon EMR","Amazon QuickSight","Amazon Athena","Amazon ElastiCache"],a:[0],e:["EMR est la plateforme big data managée (Spark, Hadoop).","QuickSight fait de la visualisation.","Athena fait du SQL sans serveur, pas du Spark managé.","ElastiCache est un cache."]},
{t:"Analytique",q:"Quel service permet la recherche plein texte et l'analyse de logs, basé sur un moteur open source ?",o:["Amazon OpenSearch Service","Amazon Kendra","Amazon Redshift","AWS Glue"],a:[0],e:["OpenSearch Service sert à la recherche et à l'analyse de logs.","Kendra est une recherche d'entreprise par machine learning, sur des documents.","Redshift est un entrepôt de données.","Glue fait de l'ETL."]},
{t:"Intégration",q:"Une application doit découpler son front-end de son traitement des commandes pour qu'aucune commande ne soit perdue lors des pics. Quel service choisir ?",o:["Amazon SQS","Amazon SNS","Amazon SES","Amazon Connect"],a:[0],e:["SQS met les messages en file d'attente jusqu'à leur traitement.","SNS diffuse des messages mais ne les garde pas en file.","SES envoie des e-mails.","Connect est un centre de contact."]},
{t:"Intégration",q:"Une alarme doit notifier une équipe par e-mail et SMS, et déclencher en même temps une fonction Lambda. Quel service choisir ?",o:["Amazon SNS","Amazon SQS","AWS Step Functions","Amazon SES"],a:[0],e:["SNS publie un message vers plusieurs abonnés (e-mail, SMS, Lambda).","SQS est une file pour un consommateur.","Step Functions orchestre des workflows.","SES sert aux e-mails en masse, pas aux SMS ni à Lambda."]},
{t:"Intégration",q:"Une équipe veut déclencher automatiquement une action chaque fois qu'une instance EC2 change d'état, ou lancer une tâche tous les jours à 2 h. Quel service choisir ?",o:["Amazon EventBridge","Amazon SQS","Amazon SES","AWS X-Ray"],a:[0],e:["EventBridge réagit aux événements et planifie des tâches.","SQS est une file de messages.","SES envoie des e-mails.","X-Ray trace des requêtes."]},
{t:"Intégration",q:"Une équipe doit enchaîner plusieurs fonctions Lambda dans un workflow avec des conditions et des reprises en cas d'erreur. Quel service choisir ?",o:["AWS Step Functions","Amazon SNS","Amazon Kinesis","AWS CodeBuild"],a:[0],e:["Step Functions orchestre visuellement des workflows.","SNS diffuse des messages.","Kinesis traite des flux de données.","CodeBuild compile du code."]},
{t:"Applications métier",q:"Une entreprise veut envoyer des e-mails marketing et transactionnels à des milliers de clients. Quel service choisir ?",o:["Amazon SES","Amazon SNS","Amazon SQS","Amazon Connect"],a:[0],e:["SES est le service d'envoi d'e-mails en masse.","SNS sert plutôt aux notifications techniques.","SQS est une file de messages.","Connect est un centre de contact."]},
{t:"Applications métier",q:"Une entreprise veut mettre en place un centre de contact téléphonique dans le cloud. Quel service choisir ?",o:["Amazon Connect","Amazon Lex seul","Amazon SES","Amazon WorkSpaces"],a:[0],e:["Connect est le centre de contact cloud d'AWS.","Lex peut s'y intégrer mais n'est pas un centre de contact.","SES envoie des e-mails.","WorkSpaces fournit des bureaux virtuels."]},
{t:"Poste de travail",q:"Une entreprise veut fournir des bureaux Windows complets à ses employés, accessibles depuis n'importe quel appareil. Quel service choisir ?",o:["Amazon WorkSpaces","Amazon AppStream 2.0","Amazon Lightsail","AWS Client VPN"],a:[0],e:["WorkSpaces fournit des bureaux virtuels complets.","AppStream 2.0 diffuse une application, pas un bureau entier.","Lightsail est un serveur virtuel.","Client VPN connecte au réseau, sans fournir de bureau."]},
{t:"Poste de travail",q:"Un éditeur de logiciel veut diffuser une seule application de conception dans le navigateur de ses clients, sans installation. Quel service choisir ?",o:["Amazon AppStream 2.0","Amazon WorkSpaces","AWS Amplify","Amazon CloudFront"],a:[0],e:["AppStream 2.0 diffuse des applications vers un navigateur.","WorkSpaces fournit un bureau complet.","Amplify construit des applis web et mobiles.","CloudFront distribue du contenu."]},
{t:"Outils dev",q:"Quel service orchestre une chaîne CI/CD complète, de la source au déploiement ?",o:["AWS CodePipeline","AWS CodeBuild","AWS X-Ray","AWS CLI"],a:[0],e:["CodePipeline automatise l'ensemble du pipeline de livraison.","CodeBuild compile et teste, c'est une étape du pipeline.","X-Ray trace des requêtes.","La CLI pilote AWS en ligne de commande."]},
{t:"Outils dev",q:"Une application distribuée est lente et l'équipe veut savoir quel composant ralentit les requêtes. Quel service utiliser ?",o:["AWS X-Ray","AWS CloudTrail","AWS CodeBuild","Amazon Inspector"],a:[0],e:["X-Ray trace les requêtes à travers les composants.","CloudTrail enregistre les appels d'API pour l'audit.","CodeBuild compile du code.","Inspector cherche des vulnérabilités."]},
{t:"Front-end / IoT",q:"Une startup veut construire et héberger rapidement une application web et mobile full-stack. Quel service choisir ?",o:["AWS Amplify","AWS IoT Core","Amazon AppStream 2.0","AWS Batch"],a:[0],e:["Amplify sert à construire et héberger des applis web et mobiles.","IoT Core connecte des objets connectés.","AppStream diffuse des applications de bureau.","Batch exécute des traitements par lots."]},
{t:"Front-end / IoT",q:"Une usine veut connecter et gérer de façon sécurisée des milliers de capteurs. Quel service choisir ?",o:["AWS IoT Core","Amazon Kinesis seul","Amazon Connect","AWS Amplify"],a:[0],e:["IoT Core connecte et gère des objets connectés.","Kinesis peut traiter les données mais ne gère pas les appareils.","Connect est un centre de contact.","Amplify sert aux applis web et mobiles."]}
];
window.QDATA = window.QDATA || {};
window.QDATA[4] = [
{t:"Responsabilité partagée",q:"Selon le modèle de responsabilité partagée, de quoi AWS est-il responsable ?",o:["De la sécurité DU cloud","De la sécurité DANS le cloud","Des données du client","Des comptes IAM du client"],a:[0],e:["AWS protège l'infrastructure : datacenters, matériel, réseau, hyperviseur.","La sécurité dans le cloud est la part du client.","Les données restent sous la responsabilité du client.","La gestion IAM appartient au client."]},
{t:"Responsabilité partagée",q:"Quelles tâches relèvent du client sur Amazon EC2 ? (2 réponses)",o:["Appliquer les correctifs de l'OS invité","Configurer les security groups","Assurer la sécurité physique des datacenters","Maintenir l'hyperviseur","Remplacer les disques défectueux"],a:[0,1],e:["Sur EC2 (IaaS), l'OS appartient au client.","Le pare-feu de l'instance est configuré par le client.","La sécurité physique relève d'AWS.","L'hyperviseur relève d'AWS.","Le matériel relève d'AWS."]},
{t:"Responsabilité partagée",q:"Qui est responsable de la destruction sécurisée des disques de stockage en fin de vie ?",o:["AWS","Le client","Un auditeur tiers","Le partenaire AWS du client"],a:[0],e:["Le matériel physique et son cycle de vie relèvent d'AWS.","Le client n'a pas accès au matériel.","Les auditeurs vérifient, ils ne détruisent pas.","Aucun partenaire n'intervient."]},
{t:"Responsabilité partagée",q:"Sur AWS Lambda, de quoi le client reste-t-il responsable ?",o:["Du code de la fonction et des permissions IAM","Des correctifs de l'OS","De la mise à l'échelle des serveurs","Du runtime d'exécution"],a:[0],e:["Le client gère son code, ses données et ses permissions.","AWS gère l'OS sur Lambda.","AWS gère la mise à l'échelle.","AWS gère le runtime."]},
{t:"Responsabilité partagée",q:"Sur Amazon DynamoDB, quelle responsabilité incombe au client ?",o:["Gérer qui a accès aux tables","Appliquer les correctifs du service","Assurer la sécurité physique","Gérer le matériel de stockage"],a:[0],e:["Les accès (IAM) restent au client sur tout service.","Les correctifs relèvent d'AWS pour un service managé.","La sécurité physique relève d'AWS.","Le matériel relève d'AWS."]},
{t:"Responsabilité partagée",q:"Quels contrôles sont considérés comme partagés entre AWS et le client ? (2 réponses)",o:["La gestion des correctifs","La sensibilisation et la formation","La sécurité physique des datacenters","Les contrôles environnementaux","Le chiffrement du réseau mondial AWS"],a:[0,1],e:["AWS corrige l'infrastructure, le client corrige ses OS invités et ses applis.","Chacun forme ses propres équipes.","La sécurité physique est un contrôle hérité, relevant d'AWS seul.","Les contrôles environnementaux sont hérités d'AWS.","Le réseau mondial relève d'AWS."]},
{t:"Responsabilité partagée",q:"Plus un service est managé (par exemple Lambda par rapport à EC2), que se passe-t-il ?",o:["AWS prend en charge davantage de responsabilités","Le client prend en charge davantage de responsabilités","Les responsabilités restent identiques","Le client n'a plus aucune responsabilité"],a:[0],e:["Avec un service managé, AWS gère l'OS, le runtime, la mise à l'échelle.","C'est l'inverse.","La répartition change selon le service.","Le client reste toujours responsable de ses données et accès."]},
{t:"Responsabilité partagée",q:"Qui décide d'activer le chiffrement des données au repos dans un bucket S3 ?",o:["Le client","AWS","Un partenaire certifié","AWS Support"],a:[0],e:["AWS fournit les outils, le client choisit et configure la protection de ses données.","AWS chiffre par défaut aujourd'hui, mais le choix des clés et des règles reste au client.","Aucun partenaire n'est requis.","Le support ne configure pas les ressources du client."]},
{t:"Responsabilité partagée",q:"Sur Amazon RDS, quelle tâche reste à la charge du client ?",o:["Gérer les utilisateurs et les droits de la base de données","Appliquer les correctifs de l'OS sous-jacent","Remplacer le matériel défectueux","Maintenir l'hyperviseur"],a:[0],e:["Les comptes et permissions de la base relèvent du client.","RDS est managé : AWS corrige l'OS.","Le matériel relève d'AWS.","L'hyperviseur relève d'AWS."]},
{t:"IAM",q:"Quel principe consiste à n'accorder que les permissions strictement nécessaires à une tâche ?",o:["Le principe du moindre privilège","La responsabilité partagée","La défense en profondeur","L'élasticité"],a:[0],e:["C'est la définition du moindre privilège.","La responsabilité partagée répartit la sécurité entre AWS et le client.","La défense en profondeur consiste à empiler des couches de sécurité.","L'élasticité est un concept de capacité."]},
{t:"IAM",q:"Une application sur EC2 doit écrire dans un bucket S3. Quelle est la méthode recommandée ?",o:["Attacher un rôle IAM à l'instance","Stocker des clés d'accès dans le code","Stocker des clés d'accès dans un fichier sur l'instance","Rendre le bucket public"],a:[0],e:["Le rôle fournit des identifiants temporaires renouvelés automatiquement.","Des clés dans le code risquent de fuiter.","Des clés stockées sur disque restent un risque.","Un bucket public expose les données à tous."]},
{t:"IAM",q:"20 développeurs ont besoin des mêmes permissions. Quelle est la meilleure pratique ?",o:["Les placer dans un groupe IAM auquel on attache une policy","Attacher une policy individuelle à chacun","Leur partager un seul utilisateur IAM","Leur donner les identifiants root"],a:[0],e:["Un groupe centralise les permissions et simplifie la gestion.","Faisable mais difficile à maintenir.","Partager un compte empêche la traçabilité.","Le root ne doit jamais être partagé."]},
{t:"IAM",q:"Quelle affirmation sur les groupes IAM est correcte ?",o:["Un groupe ne peut contenir que des utilisateurs","Un groupe peut contenir d'autres groupes","Un groupe peut contenir des rôles","Un groupe peut se connecter à la console"],a:[0],e:["Les groupes IAM ne contiennent que des users.","Les groupes imbriqués n'existent pas dans IAM.","Les rôles ne sont pas membres de groupes.","Un groupe n'a pas d'identifiants de connexion."]},
{t:"IAM",q:"Dans IAM, que se passe-t-il quand une policy autorise une action et qu'une autre la refuse explicitement ?",o:["Le refus explicite l'emporte","L'autorisation l'emporte","La policy la plus récente l'emporte","AWS demande une confirmation"],a:[0],e:["Un Deny explicite prime toujours sur un Allow.","L'autorisation ne passe jamais devant un refus explicite.","L'ordre de création n'a aucun effet.","IAM ne demande aucune confirmation."]},
{t:"IAM",q:"Quel format utilisent les policies IAM ?",o:["JSON","XML","YAML uniquement","CSV"],a:[0],e:["Les policies IAM sont des documents JSON.","IAM n'utilise pas XML pour les policies.","CloudFormation accepte YAML, pas les policies IAM.","CSV est le format du credential report."]},
{t:"IAM",q:"Un utilisateur du compte A doit accéder à des ressources du compte B. Quelle est la méthode recommandée ?",o:["Créer un rôle IAM dans le compte B que l'utilisateur du compte A peut endosser","Créer un nouvel utilisateur IAM dans le compte B et partager le mot de passe","Partager les identifiants root du compte B","Fusionner les deux comptes"],a:[0],e:["Le rôle inter-comptes donne un accès temporaire et contrôlé.","Multiplier les users partagés est une mauvaise pratique.","Le root ne doit jamais être partagé.","Inutile et souvent impossible."]},
{t:"IAM",q:"Quelles sont les bonnes pratiques pour protéger l'utilisateur root ? (2 réponses)",o:["Activer la MFA sur le compte root","Ne pas créer de clés d'accès pour le root","Utiliser le root pour les tâches quotidiennes","Partager le mot de passe root avec l'équipe d'admins","Désactiver complètement le root"],a:[0,1],e:["La MFA protège contre le vol du mot de passe.","Des clés root seraient un risque majeur.","Le root ne doit servir qu'aux rares tâches qui l'exigent.","Ne jamais partager le root.","Le root d'un compte autonome ne peut pas être supprimé."]},
{t:"IAM",q:"Quelle tâche ne peut être effectuée QUE par l'utilisateur root ?",o:["Changer le plan AWS Support","Créer un bucket S3","Lancer une instance EC2","Créer un utilisateur IAM"],a:[0],e:["Modifier ou annuler le plan de support est réservé au root.","Un user IAM autorisé peut créer un bucket.","Un user IAM autorisé peut lancer une instance.","Un administrateur IAM peut créer des users."]},
{t:"IAM",q:"Quelles tâches sont réservées à l'utilisateur root ? (2 réponses)",o:["Fermer le compte AWS","Modifier l'adresse e-mail du compte","Créer un groupe IAM","Consulter Cost Explorer","Créer une policy IAM"],a:[0,1],e:["La fermeture du compte exige le root.","La modification des paramètres du compte exige le root.","Un administrateur IAM peut le faire.","Un user IAM autorisé peut y accéder.","Un administrateur IAM peut le faire."]},
{t:"IAM",q:"Quel service permet aux employés de se connecter une seule fois pour accéder à plusieurs comptes AWS et applications métier ?",o:["AWS IAM Identity Center","Amazon Cognito","AWS Secrets Manager","AWS Artifact"],a:[0],e:["IAM Identity Center (ex-AWS SSO) fournit l'authentification unique.","Cognito gère les utilisateurs d'une application.","Secrets Manager stocke des secrets.","Artifact fournit des rapports de conformité."]},
{t:"IAM",q:"Une application mobile doit permettre à ses utilisateurs de s'inscrire et de se connecter avec Google ou Facebook. Quel service choisir ?",o:["Amazon Cognito","AWS IAM Identity Center","AWS Directory Service","Des utilisateurs IAM pour chaque client"],a:[0],e:["Cognito gère l'authentification des utilisateurs finaux d'une appli.","Identity Center vise les employés.","Directory Service fournit Active Directory.","IAM n'est pas fait pour des millions de clients finaux."]},
{t:"IAM",q:"Une entreprise veut stocker les mots de passe de ses bases de données avec une rotation automatique. Quel service choisir ?",o:["AWS Secrets Manager","AWS KMS","Amazon Macie","AWS Artifact"],a:[0],e:["Secrets Manager stocke les secrets et automatise leur rotation.","KMS gère des clés de chiffrement, pas des mots de passe.","Macie détecte des données sensibles.","Artifact fournit des rapports."]},
{t:"IAM",q:"Une équipe veut stocker des paramètres de configuration de façon centralisée et peu coûteuse. Quel service convient ?",o:["AWS Systems Manager Parameter Store","Amazon S3 Glacier","AWS CloudHSM","Amazon Inspector"],a:[0],e:["Parameter Store stocke des paramètres et des secrets simples.","Glacier sert à l'archivage.","CloudHSM est un module matériel de clés.","Inspector cherche des vulnérabilités."]},
{t:"IAM",q:"Une entreprise veut que ses employés utilisent leurs identifiants Active Directory existants pour accéder à AWS, sans créer d'utilisateurs IAM. Comment s'appelle ce mécanisme ?",o:["La fédération d'identités","Le principe du moindre privilège","La facturation consolidée","Le chiffrement en transit"],a:[0],e:["La fédération permet d'utiliser un fournisseur d'identité externe (SAML, AD).","Le moindre privilège concerne l'étendue des droits.","La facturation consolidée concerne les factures.","Le chiffrement en transit protège les données qui circulent."]},
{t:"IAM",q:"Quels éléments renforcent l'authentification sur AWS ? (2 réponses)",o:["L'authentification multifacteur (MFA)","Une politique de mots de passe exigeante","Le partage de comptes entre collègues","Des clés d'accès qui n'expirent jamais","Un bucket S3 public"],a:[0,1],e:["La MFA ajoute un second facteur.","Longueur, complexité et rotation renforcent les mots de passe.","Le partage empêche la traçabilité.","Les clés doivent tourner régulièrement.","Un bucket public n'a aucun lien avec l'authentification."]},
{t:"IAM",q:"Quel rapport IAM liste tous les utilisateurs et l'état de leurs identifiants (MFA, âge des clés, dernière utilisation) ?",o:["Le credential report","Le rapport d'utilisation et de coût","AWS Artifact","Le tableau de bord AWS Health"],a:[0],e:["Le credential report recense l'état des identifiants de chaque utilisateur.","Ce rapport concerne la facturation.","Artifact fournit les rapports de conformité d'AWS.","Health signale les événements AWS."]},
{t:"IAM",q:"Une policy écrite par AWS, prête à l'emploi et maintenue par AWS, s'appelle :",o:["Une policy gérée par AWS","Une policy inline","Une policy gérée par le client","Une SCP"],a:[0],e:["Les policies gérées par AWS sont créées et mises à jour par AWS.","Une policy inline est collée à une seule identité.","Une policy gérée par le client est écrite par le client.","Une SCP s'applique aux comptes d'une organisation."]},
{t:"Sécurité",q:"Quel service protège gratuitement et automatiquement toutes les applications AWS contre les attaques DDoS les plus courantes ?",o:["AWS Shield Standard","AWS Shield Advanced","AWS WAF","Amazon GuardDuty"],a:[0],e:["Shield Standard est gratuit et activé pour tous.","Shield Advanced est payant.","WAF filtre les requêtes web et doit être configuré.","GuardDuty détecte des menaces, sans bloquer les DDoS."]},
{t:"Sécurité",q:"Une entreprise veut une équipe de réponse aux attaques DDoS disponible 24/7 et une protection contre les surcoûts dus à une attaque. Quel service choisir ?",o:["AWS Shield Advanced","AWS Shield Standard","AWS Firewall Manager","Amazon Inspector"],a:[0],e:["Shield Advanced inclut l'équipe de réponse DDoS et la protection des coûts.","Shield Standard ne propose ni équipe ni protection des coûts.","Firewall Manager centralise des règles.","Inspector cherche des vulnérabilités."]},
{t:"Sécurité",q:"Une application web subit des tentatives d'injection SQL et de cross-site scripting. Quel service les bloque ?",o:["AWS WAF","AWS Shield Standard","Amazon Macie","Network ACL"],a:[0],e:["WAF filtre les requêtes HTTP malveillantes (couche 7).","Shield vise les DDoS.","Macie détecte des données sensibles.","Une NACL filtre par IP et port, sans lire le contenu HTTP."]},
{t:"Sécurité",q:"Une entreprise avec 40 comptes AWS veut appliquer les mêmes règles WAF et security groups partout, de façon centralisée. Quel service choisir ?",o:["AWS Firewall Manager","AWS WAF seul dans chaque compte","Amazon GuardDuty","AWS Trusted Advisor"],a:[0],e:["Firewall Manager centralise les règles sur tous les comptes d'une organisation.","Configurer WAF compte par compte est fastidieux.","GuardDuty détecte des menaces.","Trusted Advisor recommande, il n'applique pas de règles."]},
{t:"Sécurité",q:"Quel service utilise le machine learning sur CloudTrail, les VPC Flow Logs et les journaux DNS pour détecter une activité malveillante ?",o:["Amazon GuardDuty","Amazon Inspector","Amazon Macie","AWS Config"],a:[0],e:["GuardDuty est le service de détection de menaces.","Inspector cherche des vulnérabilités logicielles.","Macie cherche des données sensibles.","Config suit la configuration des ressources."]},
{t:"Sécurité",q:"Une entreprise veut scanner automatiquement ses instances EC2 et ses images de conteneurs pour trouver des vulnérabilités logicielles connues (CVE). Quel service choisir ?",o:["Amazon Inspector","Amazon GuardDuty","AWS Shield","Amazon Detective"],a:[0],e:["Inspector scanne les vulnérabilités logicielles.","GuardDuty analyse des comportements, pas des failles logicielles.","Shield protège des DDoS.","Detective enquête après un incident."]},
{t:"Sécurité",q:"Une entreprise veut découvrir automatiquement les données personnelles et numéros de carte bancaire stockés dans ses buckets S3. Quel service choisir ?",o:["Amazon Macie","Amazon Inspector","AWS WAF","AWS KMS"],a:[0],e:["Macie identifie les données sensibles dans S3.","Inspector cherche des failles logicielles.","WAF filtre des requêtes web.","KMS chiffre mais ne découvre pas les données."]},
{t:"Sécurité",q:"Après une alerte GuardDuty, l'équipe sécurité veut analyser et visualiser la cause de l'incident. Quel service utiliser ?",o:["Amazon Detective","AWS Artifact","AWS Shield","Amazon Macie"],a:[0],e:["Detective aide à enquêter sur l'origine d'un incident.","Artifact fournit des rapports.","Shield protège des DDoS.","Macie détecte des données sensibles."]},
{t:"Sécurité",q:"Quel service regroupe dans un tableau de bord central les alertes de GuardDuty, Inspector, Macie et vérifie le respect des bonnes pratiques ?",o:["AWS Security Hub","Amazon Detective","AWS Firewall Manager","AWS Config"],a:[0],e:["Security Hub centralise les résultats de sécurité.","Detective sert à enquêter.","Firewall Manager centralise des règles de pare-feu.","Config suit les configurations sans agréger les alertes de sécurité."]},
{t:"Chiffrement",q:"Quel service permet de créer et gérer les clés utilisées pour chiffrer les données au repos dans S3, EBS et RDS ?",o:["AWS KMS","AWS Certificate Manager","AWS Secrets Manager","Amazon Macie"],a:[0],e:["KMS gère les clés de chiffrement, intégré à la plupart des services.","ACM gère des certificats SSL/TLS.","Secrets Manager stocke des secrets.","Macie détecte des données sensibles."]},
{t:"Chiffrement",q:"Une réglementation exige que l'entreprise ait le contrôle exclusif de ses clés, sur un matériel dédié auquel AWS n'a pas accès. Quel service choisir ?",o:["AWS CloudHSM","AWS KMS avec clés gérées par AWS","AWS Secrets Manager","AWS Certificate Manager"],a:[0],e:["CloudHSM fournit un module matériel dédié contrôlé par le client seul.","Avec KMS, le matériel est partagé et géré par AWS.","Secrets Manager ne gère pas de matériel cryptographique.","ACM gère des certificats."]},
{t:"Chiffrement",q:"Quel service fournit gratuitement des certificats SSL/TLS publics avec renouvellement automatique ?",o:["AWS Certificate Manager (ACM)","AWS KMS","AWS CloudHSM","AWS Artifact"],a:[0],e:["ACM émet et renouvelle les certificats publics.","KMS gère des clés, pas des certificats.","CloudHSM est un module matériel.","Artifact fournit des rapports de conformité."]},
{t:"Chiffrement",q:"Comment protéger les données qui circulent entre le navigateur d'un utilisateur et un site web hébergé sur AWS ?",o:["Chiffrement en transit avec TLS","Chiffrement au repos avec KMS","Activer le versioning S3","Utiliser S3 Glacier"],a:[0],e:["TLS (HTTPS) chiffre les données pendant leur transfert.","Le chiffrement au repos protège les données stockées.","Le versioning protège des suppressions.","Glacier est une classe d'archivage."]},
{t:"Chiffrement",q:"Quels sont les deux types de chiffrement à connaître sur AWS ? (2 réponses)",o:["Chiffrement au repos","Chiffrement en transit","Chiffrement en mémoire cache","Chiffrement par région","Chiffrement par edge location"],a:[0,1],e:["Il protège les données stockées.","Il protège les données qui circulent.","Pas une catégorie standard.","Pas une catégorie standard.","Pas une catégorie standard."]},
{t:"Sécurité",q:"Où une entreprise peut-elle trouver des produits de sécurité d'éditeurs tiers (pare-feux, antivirus) prêts à déployer sur AWS ?",o:["AWS Marketplace","AWS Artifact","AWS Trusted Advisor","AWS Health Dashboard"],a:[0],e:["Marketplace propose des logiciels tiers, dont des produits de sécurité.","Artifact fournit des rapports de conformité.","Trusted Advisor donne des recommandations.","Health signale des événements de service."]},
{t:"Sécurité",q:"Quelles sources officielles d'information sur la sécurité AWS existe-t-il ? (2 réponses)",o:["AWS Security Blog","AWS Security Center","Un forum non officiel de dumps","AWS Artifact pour les tickets","Amazon Macie"],a:[0,1],e:["Le blog sécurité publie les nouveautés et bonnes pratiques.","Le Security Center centralise les ressources de sécurité.","Pas une source officielle ni fiable.","Artifact ne gère pas de tickets.","Macie est un service, pas une source documentaire."]},
{t:"Sécurité",q:"Quel service signale par exemple que la MFA n'est pas activée sur le root ou que des ports sont ouverts à tous ?",o:["AWS Trusted Advisor","AWS Artifact","Amazon Polly","AWS Batch"],a:[0],e:["Trusted Advisor inclut des contrôles de sécurité de base.","Artifact fournit des rapports.","Polly synthétise la voix.","Batch exécute des traitements."]},
{t:"Sécurité",q:"Quel service permet de partager des sous-réseaux ou un Transit Gateway avec d'autres comptes AWS ?",o:["AWS Resource Access Manager (RAM)","AWS Organizations SCP","AWS IAM Identity Center","AWS Artifact"],a:[0],e:["RAM partage des ressources entre comptes.","Les SCP limitent les permissions, elles ne partagent pas.","Identity Center gère les connexions.","Artifact fournit des rapports."]},
{t:"Sécurité",q:"Quelle différence y a-t-il entre GuardDuty et Inspector ?",o:["GuardDuty détecte des comportements suspects, Inspector des failles logicielles","GuardDuty chiffre les données, Inspector les sauvegarde","Les deux protègent des DDoS","Inspector analyse les logs DNS, GuardDuty les CVE"],a:[0],e:["C'est exactement la distinction à retenir.","Aucun des deux ne chiffre ni ne sauvegarde.","Les DDoS relèvent de Shield.","C'est l'inverse."]},
{t:"Sécurité",q:"Quels services protègent une application web exposée sur internet ? (2 réponses)",o:["AWS WAF","AWS Shield","AWS Batch","Amazon Polly","AWS Glue"],a:[0,1],e:["WAF filtre les requêtes malveillantes.","Shield protège contre les DDoS.","Batch exécute des traitements par lots.","Polly synthétise la voix.","Glue fait de l'ETL."]},
{t:"Responsabilité partagée",q:"Dans le modèle de responsabilité partagée, que sont les contrôles hérités ?",o:["Les contrôles physiques et environnementaux qu'AWS assure et dont le client bénéficie","Les permissions IAM transmises d'un groupe à ses membres","Les règles de pare-feu copiées entre comptes","Les sauvegardes conservées après la fermeture d'un compte"],a:[0],e:["Le client hérite des contrôles qu'AWS met en place sur l'infrastructure.","C'est une notion IAM, pas de responsabilité partagée.","Ce n'est pas une notion de responsabilité partagée.","Ce n'est pas une notion de responsabilité partagée."]},
{t:"IAM",q:"Une instance EC2 doit lire une table DynamoDB. Quelle identité IAM lui attacher ?",o:["Un rôle IAM avec une policy limitée à cette table","Un utilisateur IAM avec des clés stockées sur l'instance","Le compte root","Un groupe IAM"],a:[0],e:["Le rôle fournit des identifiants temporaires, limités au besoin (moindre privilège).","Stocker des clés sur l'instance est une mauvaise pratique.","Le root ne doit jamais servir à ça.","Un groupe ne peut pas être attaché à une instance."]},
{t:"Sécurité",q:"Quelle affirmation sur AWS Shield Standard est correcte ?",o:["Il est inclus sans coût supplémentaire pour tous les clients AWS","Il nécessite le plan de support Enterprise","Il inclut une équipe de réponse DDoS 24/7","Il protège contre les injections SQL"],a:[0],e:["Shield Standard est automatique et gratuit.","Aucun plan de support n'est requis.","L'équipe de réponse est incluse dans Shield Advanced.","Les injections SQL relèvent de WAF."]}

{t:"Monitoring",q:"Un responsable sécurité veut savoir quel utilisateur a supprimé un bucket S3 hier. Quel service consulter ?",o:["AWS CloudTrail","Amazon CloudWatch","AWS Config","AWS X-Ray"],a:[0],e:["CloudTrail enregistre qui a fait quel appel d'API, et quand.","CloudWatch surveille les performances.","Config suit l'état des ressources, pas l'auteur des actions.","X-Ray trace les requêtes applicatives."]},
{t:"Monitoring",q:"Une équipe veut recevoir une alerte quand l'utilisation CPU d'une instance dépasse 80 %. Quel service utiliser ?",o:["Amazon CloudWatch","AWS CloudTrail","AWS Artifact","AWS Config"],a:[0],e:["CloudWatch collecte les métriques et déclenche des alarmes.","CloudTrail audite les appels d'API.","Artifact fournit des rapports.","Config vérifie des règles de configuration."]},
{t:"Monitoring",q:"Une entreprise veut vérifier en continu que tous ses volumes EBS sont chiffrés et garder l'historique des changements de configuration. Quel service choisir ?",o:["AWS Config","Amazon CloudWatch","Amazon Inspector","AWS Shield"],a:[0],e:["Config évalue les ressources contre des règles et garde l'historique.","CloudWatch surveille les performances.","Inspector cherche des vulnérabilités logicielles.","Shield protège des DDoS."]},
{t:"Monitoring",q:"Combien de temps CloudTrail conserve-t-il par défaut l'historique des événements de gestion dans la console ?",o:["90 jours","7 jours","1 an","Indéfiniment"],a:[0],e:["L'historique des événements couvre 90 jours.","La durée est plus longue.","Pour conserver plus longtemps, il faut créer un trail vers S3.","Pas sans un trail configuré."]},
{t:"Monitoring",q:"Quels services aident à la gouvernance et à l'audit ? (2 réponses)",o:["AWS CloudTrail","AWS Config","Amazon Polly","Amazon Lightsail","AWS Amplify"],a:[0,1],e:["CloudTrail fournit la piste d'audit des appels d'API.","Config suit la conformité des configurations.","Polly synthétise la voix.","Lightsail est un serveur virtuel.","Amplify sert aux applis web et mobiles."]},
{t:"Monitoring",q:"Où une application peut-elle centraliser ses fichiers de logs pour les rechercher et créer des alarmes dessus ?",o:["Amazon CloudWatch Logs","AWS Artifact","Amazon S3 Glacier Deep Archive","AWS CloudHSM"],a:[0],e:["CloudWatch Logs collecte, stocke et permet d'interroger les logs.","Artifact fournit des rapports de conformité.","Deep Archive est fait pour l'archive, pas la recherche.","CloudHSM gère des clés."]},
{t:"Conformité",q:"Un auditeur demande le rapport SOC 2 d'AWS. Où le télécharger ?",o:["AWS Artifact","AWS Audit Manager","AWS Config","AWS Security Hub"],a:[0],e:["Artifact est le portail des rapports de conformité d'AWS.","Audit Manager prépare les audits de l'usage du client.","Config évalue les ressources du client.","Security Hub centralise des alertes."]},
{t:"Conformité",q:"Une entreprise veut collecter automatiquement les preuves de conformité de son propre usage d'AWS pour préparer un audit PCI DSS. Quel service choisir ?",o:["AWS Audit Manager","AWS Artifact","AWS Trusted Advisor","Amazon Macie"],a:[0],e:["Audit Manager évalue en continu l'usage du client et collecte les preuves.","Artifact fournit la conformité d'AWS, pas celle du client.","Trusted Advisor fait des recommandations générales.","Macie détecte des données sensibles."]},
{t:"Conformité",q:"Où un client peut-il accepter un accord spécifique comme le BAA (Business Associate Addendum) pour des données de santé ?",o:["AWS Artifact","AWS Organizations","AWS Support Center","AWS Marketplace"],a:[0],e:["Artifact permet de consulter et d'accepter des accords.","Organizations gère des comptes.","Le Support Center gère des tickets.","Marketplace vend des logiciels."]},
{t:"Conformité",q:"Quelle affirmation sur la conformité dans AWS est correcte ?",o:["Les exigences varient selon le pays, le secteur et le service AWS utilisé","Tous les services AWS sont conformes à toutes les normes","La conformité est entièrement gérée par AWS","La conformité ne dépend que de la région"],a:[0],e:["RGPD, HIPAA ou PCI DSS ne couvrent pas tous les services de la même façon.","Chaque service a ses propres programmes de conformité.","Le client reste responsable de sa propre conformité.","Le secteur et le service comptent aussi."]},
{t:"Gouvernance",q:"Quels avantages apporte AWS Organizations ? (2 réponses)",o:["La facturation consolidée de plusieurs comptes","L'application de SCP pour limiter les permissions des comptes","Le chiffrement automatique de toutes les données","La détection des menaces","Un TAM dédié"],a:[0,1],e:["Une seule facture et des remises cumulées.","Les SCP fixent des limites maximales par compte.","Le chiffrement relève de KMS.","La détection relève de GuardDuty.","Le TAM dépend du plan de support."]},
{t:"Gouvernance",q:"Une entreprise veut interdire à tous les comptes de développement d'utiliser des régions hors d'Europe, même à leurs administrateurs. Quel mécanisme utiliser ?",o:["Une Service Control Policy (SCP) dans AWS Organizations","Une policy IAM inline sur chaque utilisateur","Un security group","AWS Budgets"],a:[0],e:["Une SCP limite ce que tout un compte peut faire, root du compte membre compris.","Des policies individuelles peuvent être contournées par un admin du compte.","Un security group filtre le trafic réseau.","Budgets suit les dépenses."]},
{t:"Gouvernance",q:"Une entreprise veut mettre en place rapidement un environnement multi-comptes sécurisé avec des garde-fous prédéfinis. Quel service choisir ?",o:["AWS Control Tower","AWS Config seul","Amazon Inspector","AWS License Manager"],a:[0],e:["Control Tower automatise la création d'une landing zone multi-comptes.","Config vérifie des règles mais ne crée pas l'environnement.","Inspector cherche des vulnérabilités.","License Manager suit les licences."]},
{t:"Gouvernance",q:"Une DSI veut que ses équipes ne puissent déployer que des produits approuvés (modèles validés), en libre-service. Quel service choisir ?",o:["AWS Service Catalog","AWS Marketplace","AWS Artifact","Amazon EventBridge"],a:[0],e:["Service Catalog propose un catalogue de produits pré-approuvés.","Marketplace vend des logiciels tiers.","Artifact fournit des rapports.","EventBridge gère des événements."]},
{t:"Gouvernance",q:"Une entreprise doit suivre l'usage de ses licences Microsoft et Oracle pour éviter de dépasser ses droits. Quel service choisir ?",o:["AWS License Manager","AWS Budgets","AWS Artifact","AWS Secrets Manager"],a:[0],e:["License Manager suit et limite l'usage des licences.","Budgets suit des montants, pas des licences.","Artifact fournit des rapports.","Secrets Manager stocke des secrets."]},
{t:"Gouvernance",q:"Une équipe atteint la limite du nombre d'instances autorisées dans une région. Quel service permet de voir et de demander l'augmentation de cette limite ?",o:["Service Quotas","AWS Budgets","AWS Artifact","Amazon Inspector"],a:[0],e:["Service Quotas affiche les limites et permet d'en demander l'augmentation.","Budgets suit les dépenses.","Artifact fournit des rapports.","Inspector cherche des vulnérabilités."]},
{t:"Gouvernance",q:"Une entreprise veut savoir si une maintenance planifiée par AWS va affecter ses propres instances. Où regarder ?",o:["La vue personnalisée du tableau de bord AWS Health","AWS CloudTrail","AWS Artifact","Amazon Inspector"],a:[0],e:["AWS Health affiche les événements qui touchent les ressources du client.","CloudTrail audite les appels d'API.","Artifact fournit des rapports.","Inspector cherche des vulnérabilités."]},
{t:"Gouvernance",q:"Quel service permet de gérer une flotte de serveurs EC2 et sur site : correctifs, commandes à distance et sessions sans SSH ?",o:["AWS Systems Manager","AWS Config","Amazon CloudFront","AWS Control Tower"],a:[0],e:["Systems Manager gère les opérations sur une flotte de serveurs.","Config suit les configurations, sans agir sur les serveurs.","CloudFront est un CDN.","Control Tower gère un environnement multi-comptes."]},
{t:"Déploiement",q:"Une entreprise veut déployer exactement la même infrastructure dans trois régions, de façon reproductible. Quel service choisir ?",o:["AWS CloudFormation","La console de gestion AWS","AWS Config","AWS Trusted Advisor"],a:[0],e:["CloudFormation décrit l'infrastructure en code (IaC) et la redéploie à l'identique.","La console est manuelle et source d'erreurs.","Config observe, il ne déploie pas.","Trusted Advisor recommande, il ne déploie pas."]},
{t:"Déploiement",q:"Quelles méthodes d'accès programmatique à AWS existe-t-il ? (2 réponses)",o:["AWS CLI","Les SDK AWS","La console de gestion AWS","AWS Artifact","Le tableau de bord AWS Health"],a:[0,1],e:["La CLI pilote AWS en ligne de commande.","Les SDK intègrent AWS dans le code d'une application.","La console est une interface web, pas un accès programmatique.","Artifact fournit des rapports.","Health est un tableau de bord."]},
{t:"Déploiement",q:"Un administrateur doit vérifier rapidement, une seule fois, le statut d'une ressource. Quelle méthode est la plus adaptée ?",o:["La console de gestion AWS","AWS CloudFormation","Un pipeline AWS CodePipeline","Un SDK dans une application"],a:[0],e:["La console convient aux opérations ponctuelles.","CloudFormation vise les déploiements reproductibles.","Un pipeline est disproportionné pour une vérification ponctuelle.","Écrire du code est disproportionné ici."]},
{t:"Déploiement",q:"Quels modèles de déploiement du cloud existe-t-il ? (2 réponses)",o:["Hybride","Cloud (tout dans le cloud)","Régional","Edge-only","Multi-AZ"],a:[0,1],e:["L'hybride combine on-premises et cloud.","Le modèle cloud place tout chez un fournisseur.","Une région n'est pas un modèle de déploiement.","Pas un modèle de déploiement reconnu.","Multi-AZ est une architecture, pas un modèle de déploiement."]},
{t:"Avantages",q:"Quel avantage du cloud décrit le passage d'investissements initiaux à des paiements à l'usage ?",o:["Remplacer les dépenses d'investissement (CapEx) par des dépenses variables (OpEx)","Profiter d'économies d'échelle massives","Augmenter la vitesse et l'agilité","Devenir mondial en quelques minutes"],a:[0],e:["On ne paie plus de serveurs d'avance, seulement ce qu'on consomme.","Les économies d'échelle concernent la baisse des prix.","L'agilité concerne la rapidité.","Le mondial concerne la portée géographique."]},
{t:"Avantages",q:"AWS achète du matériel en très grandes quantités et répercute la baisse des coûts sur ses clients. Quel avantage du cloud cela illustre-t-il ?",o:["Les économies d'échelle","L'élasticité","La haute disponibilité","La responsabilité partagée"],a:[0],e:["L'usage cumulé de tous les clients fait baisser les prix.","L'élasticité concerne l'ajustement de capacité.","La haute disponibilité concerne la résistance aux pannes.","La responsabilité partagée concerne la sécurité."]},
{t:"Avantages",q:"Une entreprise n'a plus besoin de prévoir sa capacité serveur pour les 3 prochaines années. Quel avantage du cloud cela illustre-t-il ?",o:["Arrêter de deviner la capacité","Payer pour faire tourner des datacenters","Remplacer les dépenses variables par des dépenses fixes","Augmenter les coûts de maintenance"],a:[0],e:["Le cloud permet d'ajuster la capacité à la demande réelle.","C'est l'inverse : on arrête de payer pour des datacenters.","C'est l'inverse.","C'est l'inverse."]},
{t:"Avantages",q:"Une équipe peut tester une idée en lançant des serveurs en quelques minutes, puis les supprimer si l'idée échoue. Quel avantage du cloud cela illustre-t-il ?",o:["L'agilité","La conformité","La durabilité S3","La tolérance aux pannes"],a:[0],e:["L'agilité permet d'expérimenter vite et à faible coût.","La conformité concerne les normes.","La durabilité S3 concerne la non-perte des données.","La tolérance aux pannes concerne la continuité de service."]},
{t:"Avantages",q:"Quelle différence y a-t-il entre élasticité et scalabilité ?",o:["L'élasticité ajuste automatiquement la capacité à la hausse et à la baisse, la scalabilité est la capacité à grandir","Ce sont deux synonymes","La scalabilité est automatique, l'élasticité est manuelle","L'élasticité ne concerne que le stockage"],a:[0],e:["L'élasticité suit la demande en continu ; la scalabilité est l'aptitude à monter en charge.","Les deux notions sont proches mais distinctes.","C'est plutôt l'inverse.","L'élasticité s'applique à toutes les ressources."]},
{t:"Well-Architected",q:"Combien de piliers compte le cadre AWS Well-Architected ?",o:["6","5","4","7"],a:[0],e:["Excellence opérationnelle, sécurité, fiabilité, efficacité des performances, optimisation des coûts, durabilité.","Le pilier Durabilité a été ajouté en 2021, portant le total à 6.","Il y en a 6.","Il y en a 6."]},
{t:"Well-Architected",q:"Quel pilier Well-Architected met l'accent sur la reprise automatique après une panne et les tests des procédures de reprise ?",o:["Fiabilité","Efficacité des performances","Excellence opérationnelle","Optimisation des coûts"],a:[0],e:["La fiabilité couvre la capacité à se remettre des pannes.","L'efficacité des performances concerne l'usage optimal des ressources.","L'excellence opérationnelle concerne les opérations et l'automatisation.","L'optimisation des coûts concerne les dépenses."]},
{t:"Well-Architected",q:"Quel pilier Well-Architected recommande de faire des modifications petites, fréquentes et réversibles et d'utiliser l'infrastructure as code ?",o:["Excellence opérationnelle","Sécurité","Durabilité","Fiabilité"],a:[0],e:["Ce sont des principes de conception de l'excellence opérationnelle.","La sécurité concerne la protection des données et systèmes.","La durabilité concerne l'impact environnemental.","La fiabilité concerne la résistance aux pannes."]},
{t:"Well-Architected",q:"Quel pilier vise à réduire l'impact environnemental des charges de travail dans le cloud ?",o:["Durabilité","Optimisation des coûts","Fiabilité","Efficacité des performances"],a:[0],e:["La durabilité porte sur l'empreinte environnementale.","Les coûts sont un pilier distinct.","La fiabilité concerne les pannes.","La performance concerne l'efficacité des ressources."]},
{t:"Well-Architected",q:"Choisir le bon type d'instance et utiliser des architectures serverless pour mieux exploiter les ressources relève de quel pilier ?",o:["Efficacité des performances","Fiabilité","Sécurité","Excellence opérationnelle"],a:[0],e:["Ce pilier vise à utiliser les ressources de calcul de façon efficace.","La fiabilité concerne la reprise après panne.","La sécurité concerne la protection.","L'excellence opérationnelle concerne les opérations."]},
{t:"Well-Architected",q:"Appliquer le moindre privilège et assurer la traçabilité de toutes les actions relève de quel pilier ?",o:["Sécurité","Optimisation des coûts","Durabilité","Efficacité des performances"],a:[0],e:["Ce sont des principes du pilier Sécurité.","Les coûts sont un autre pilier.","La durabilité concerne l'environnement.","La performance concerne l'usage des ressources."]},
{t:"Well-Architected",q:"Quel outil gratuit permet d'évaluer une charge de travail par rapport aux piliers Well-Architected ?",o:["AWS Well-Architected Tool","AWS Trusted Advisor","AWS Artifact","AWS Pricing Calculator"],a:[0],e:["Le Well-Architected Tool pose des questions par pilier et propose des améliorations.","Trusted Advisor fait des contrôles automatiques, pas une revue par pilier.","Artifact fournit des rapports.","Le Pricing Calculator estime des coûts."]},
{t:"CAF",q:"Quelles perspectives du Cloud Adoption Framework (CAF) sont orientées métier ? (2 réponses)",o:["Business","Governance","Platform","Operations","Security"],a:[0,1],e:["Business est une perspective métier.","Governance est une perspective métier.","Platform est technique.","Operations est technique.","Security est technique."]},
{t:"CAF",q:"Une entreprise veut former ses équipes et accompagner le changement culturel lié au cloud. Quelle perspective du CAF est concernée ?",o:["People","Platform","Operations","Security"],a:[0],e:["La perspective People couvre la formation, la culture et l'organisation.","Platform concerne l'architecture technique.","Operations concerne l'exploitation.","Security concerne la protection."]},
{t:"CAF",q:"Quelle perspective du CAF couvre l'orchestration des initiatives cloud, la gestion des risques et le suivi des investissements ?",o:["Governance","People","Platform","Operations"],a:[0],e:["Governance couvre le portefeuille, les risques et les budgets.","People couvre la culture et les compétences.","Platform couvre l'architecture.","Operations couvre l'exploitation."]},
{t:"CAF",q:"Quels résultats métier le CAF associe-t-il à l'adoption du cloud ? (2 réponses)",o:["Réduction du risque métier","Augmentation des revenus","Suppression de toute responsabilité de sécurité","Fin des coûts informatiques","Garantie de 100 % de disponibilité"],a:[0,1],e:["Le CAF cite la réduction du risque métier.","Le CAF cite l'augmentation des revenus.","Le client garde ses responsabilités de sécurité.","Les coûts deviennent variables, ils ne disparaissent pas.","Aucune garantie de 100 % n'existe."]},
{t:"Migration 7R",q:"Une entreprise migre ses serveurs vers EC2 sans aucune modification. Quelle stratégie de migration est utilisée ?",o:["Rehost (lift & shift)","Refactor","Repurchase","Retire"],a:[0],e:["Le rehost déplace les applications telles quelles.","Le refactor réécrit l'application en cloud-native.","Le repurchase remplace par un SaaS.","Le retire supprime l'application."]},
{t:"Migration 7R",q:"Une entreprise abandonne son CRM maison pour passer à une solution SaaS. Quelle stratégie de migration est utilisée ?",o:["Repurchase","Rehost","Replatform","Retain"],a:[0],e:["Repurchase (drop & shop) remplace par un produit SaaS.","Rehost garde la même application.","Replatform garde l'application avec de petites optimisations.","Retain garde l'application sur site."]},
{t:"Migration 7R",q:"Pendant la migration, une entreprise déplace sa base de données d'un serveur vers Amazon RDS sans changer le code de l'application. Quelle stratégie est utilisée ?",o:["Replatform","Refactor","Retire","Relocate"],a:[0],e:["Replatform (lift, tinker & shift) apporte une petite optimisation au passage.","Refactor implique de réécrire l'application.","Retire supprime l'application.","Relocate déplace des VM VMware telles quelles."]},
{t:"Migration 7R",q:"Une entreprise réécrit son application monolithique en microservices serverless. Quelle stratégie est utilisée ?",o:["Refactor","Rehost","Repurchase","Retain"],a:[0],e:["Le refactor (ou re-architect) transforme l'application en cloud-native.","Le rehost ne modifie rien.","Le repurchase passe à un SaaS.","Le retain garde l'existant."]},
{t:"Migration 7R",q:"Pendant l'inventaire, une entreprise découvre des applications que plus personne n'utilise. Quelle stratégie leur appliquer ?",o:["Retire","Retain","Rehost","Relocate"],a:[0],e:["Retire consiste à décommissionner ce qui ne sert plus.","Retain garde l'application en place.","Rehost la migrerait inutilement.","Relocate la déplacerait inutilement."]},
{t:"Économie",q:"Quels coûts d'un datacenter sur site sont souvent oubliés dans une comparaison avec le cloud ? (2 réponses)",o:["L'électricité et le refroidissement","Le personnel et la sécurité physique","Le prix d'un appel d'API AWS","Les frais de transfert sortant d'AWS","Le coût d'AWS Artifact"],a:[0,1],e:["L'énergie est un coût on-prem important.","Les équipes et la sécurité des locaux pèsent dans le TCO.","Ce n'est pas un coût on-prem.","Ce n'est pas un coût on-prem.","Artifact est gratuit et n'est pas un coût on-prem."]},
{t:"Économie",q:"Une entreprise utilise ses licences logicielles existantes sur AWS au lieu d'en racheter. Comment appelle-t-on ce modèle ?",o:["BYOL (Bring Your Own License)","Licence incluse","Savings Plan","Facturation consolidée"],a:[0],e:["BYOL permet de réutiliser ses licences existantes.","Avec la licence incluse, le coût est intégré au prix horaire.","Un Savings Plan est un modèle de remise.","La facturation consolidée concerne Organizations."]},
{t:"Économie",q:"Une entreprise analyse ses instances et passe celles qui sont sous-utilisées à une taille inférieure. Comment s'appelle cette pratique ?",o:["Le dimensionnement approprié (right-sizing)","Le lift & shift","La facturation consolidée","La fédération"],a:[0],e:["Le right-sizing adapte la taille des ressources à l'usage réel.","Le lift & shift est une stratégie de migration.","La facturation consolidée concerne les factures.","La fédération concerne les identités."]},
{t:"Économie",q:"Quel avantage apporte l'automatisation dans le cloud ?",o:["Moins d'erreurs humaines et des déploiements reproductibles","La suppression de tous les coûts","La fin de la responsabilité du client sur ses données","Un plan de support gratuit"],a:[0],e:["Automatiser réduit les erreurs et accélère les déploiements.","L'automatisation réduit les coûts, elle ne les supprime pas.","Le client reste responsable de ses données.","Le support n'a aucun lien."]},
{t:"Économie",q:"En passant au cloud, comment évoluent principalement les coûts d'une entreprise ?",o:["De coûts fixes vers des coûts variables","De coûts variables vers des coûts fixes","Ils deviennent tous nuls","Ils deviennent tous prévisibles à l'euro près"],a:[0],e:["On paie à l'usage au lieu d'investir d'avance.","C'est l'inverse.","Le cloud reste payant.","La facture varie avec l'usage."]},
{t:"Monitoring",q:"Quelle différence fondamentale y a-t-il entre CloudWatch et CloudTrail ?",o:["CloudWatch surveille les performances, CloudTrail enregistre qui a fait quoi","CloudWatch audite les API, CloudTrail mesure le CPU","Ce sont deux noms du même service","CloudTrail envoie des alarmes, CloudWatch non"],a:[0],e:["C'est la distinction clé : performance d'un côté, audit de l'autre.","C'est l'inverse.","Ce sont deux services distincts.","Ce sont les alarmes CloudWatch qui alertent."]},
{t:"Monitoring",q:"Une équipe veut un tableau de bord qui affiche en temps réel le nombre de requêtes et la latence de son application. Quel service utiliser ?",o:["Amazon CloudWatch","AWS CloudTrail","AWS Artifact","AWS Service Catalog"],a:[0],e:["Les tableaux de bord CloudWatch affichent les métriques en temps réel.","CloudTrail enregistre des appels d'API.","Artifact fournit des rapports.","Service Catalog liste des produits approuvés."]}
