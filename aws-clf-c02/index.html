{t:"Tarification EC2",q:"Une base de données de production tourne 24h/24 avec une charge stable pour les 3 prochaines années. Quelle option d'achat EC2 est la plus économique ?",o:["Instances réservées ou Savings Plans sur 3 ans","Instances à la demande","Instances Spot","Réservations de capacité à la demande"],a:[0],e:["Un engagement long sur une charge stable donne la remise maximale.","La demande est la plus chère pour un usage permanent.","Spot peut être interrompu : inadapté à une base de production.","Les réservations de capacité n'offrent aucune remise."]},
{t:"Tarification EC2",q:"Une entreprise lance un nouveau projet de courte durée dont la charge est imprévisible. Quelle option choisir ?",o:["Instances à la demande","Instances réservées sur 3 ans","Hôtes dédiés","Savings Plans sur 3 ans"],a:[0],e:["La demande ne nécessite aucun engagement et s'adapte à l'imprévu.","Un engagement de 3 ans est risqué pour un projet court.","Les hôtes dédiés sont chers et visent la conformité ou les licences.","Un engagement de 3 ans est inadapté."]},
{t:"Tarification EC2",q:"Un traitement par lots peut être interrompu et relancé sans problème. Quelle option offre la plus forte remise ?",o:["Instances Spot","Instances réservées","Instances à la demande","Instances dédiées"],a:[0],e:["Spot offre jusqu'à environ 90 % de remise pour des charges interruptibles.","Les réservées vont jusqu'à environ 72 %.","La demande n'offre aucune remise.","Les instances dédiées coûtent plus cher."]},
{t:"Tarification EC2",q:"Quel préavis AWS donne-t-il avant de reprendre une instance Spot ?",o:["2 minutes","24 heures","1 heure","Aucun préavis"],a:[0],e:["AWS envoie un avis d'interruption 2 minutes avant.","Le préavis est bien plus court.","Le préavis est bien plus court.","Un préavis de 2 minutes est donné."]},
{t:"Tarification EC2",q:"Une entreprise possède des licences logicielles facturées par cœur physique et veut les utiliser sur AWS. Quelle option choisir ?",o:["Hôtes dédiés","Instances dédiées","Instances Spot","Instances à la demande partagées"],a:[0],e:["Un hôte dédié donne de la visibilité sur les cœurs et sockets physiques, nécessaire pour ces licences.","Les instances dédiées isolent le matériel mais sans visibilité sur le serveur.","Spot n'apporte aucune visibilité matérielle.","Les instances partagées ne donnent aucune visibilité."]},
{t:"Tarification EC2",q:"Une entreprise doit être sûre de disposer de capacité EC2 dans une AZ précise lors d'un événement, sans s'engager sur un ou trois ans. Quelle option choisir ?",o:["Réservations de capacité à la demande","Instances Spot","Savings Plans","Instances réservées convertibles"],a:[0],e:["Les réservations de capacité garantissent de la place, sans durée d'engagement.","Spot n'offre aucune garantie de capacité.","Un Savings Plan est un engagement de dépense, sans garantie de capacité.","Une réservée convertible implique un engagement de 1 ou 3 ans."]},
{t:"Tarification EC2",q:"Quelle affirmation sur les réservations de capacité à la demande est correcte ?",o:["Elles sont facturées même si la capacité n'est pas utilisée et n'offrent pas de remise","Elles offrent jusqu'à 90 % de remise","Elles exigent un engagement de 3 ans","Elles peuvent être interrompues par AWS"],a:[0],e:["On paie la capacité réservée au tarif à la demande, utilisée ou non.","C'est le cas de Spot.","Aucune durée minimale d'engagement.","C'est le cas de Spot."]},
{t:"Tarification EC2",q:"Quelle différence y a-t-il entre une instance réservée Standard et une instance réservée Convertible ?",o:["La Convertible permet de changer de famille d'instance, avec une remise moindre","La Standard permet de changer de famille, avec une remise moindre","La Convertible est sans engagement","La Standard est réservée aux bases de données"],a:[0],e:["La flexibilité de la Convertible se paie par une remise plus faible.","C'est l'inverse.","Les deux impliquent 1 ou 3 ans d'engagement.","La Standard s'applique à EC2 en général."]},
{t:"Tarification EC2",q:"Quelle option de paiement d'une instance réservée offre la remise la plus élevée ?",o:["Paiement intégral d'avance (All Upfront)","Paiement partiel d'avance","Aucun paiement d'avance","Paiement mensuel à la demande"],a:[0],e:["Payer tout d'avance maximise la remise.","Remise intermédiaire.","Remise la plus faible des trois.","Ce n'est pas une option de réservation."]},
{t:"Tarification EC2",q:"Une entreprise n'utilise plus ses instances réservées Standard. Que peut-elle faire ?",o:["Les revendre sur la Reserved Instance Marketplace","Les échanger contre des instances Spot","Les annuler sans frais","Les convertir automatiquement en Savings Plan"],a:[0],e:["Les réservées Standard peuvent être revendues sur la marketplace dédiée.","Aucun échange vers Spot n'existe.","L'engagement ne s'annule pas.","Aucune conversion automatique n'existe."]},
{t:"Tarification EC2",q:"Que permet la flexibilité régionale d'une instance réservée ?",o:["La remise s'applique dans toutes les AZ de la région","La remise s'applique dans toutes les régions","La remise s'applique aussi à S3","La remise s'applique aux instances Spot"],a:[0],e:["Une réservée régionale couvre toutes les AZ de sa région.","Elle reste limitée à une région.","Elle ne concerne que le calcul.","Elle ne concerne pas Spot."]},
{t:"Tarification EC2",q:"Dans AWS Organizations avec facturation consolidée, que devient la remise d'une instance réservée non utilisée par le compte qui l'a achetée ?",o:["Elle peut bénéficier aux autres comptes de l'organisation","Elle est perdue","Elle est remboursée","Elle est convertie en crédits Spot"],a:[0],e:["Les remises des réservées sont partagées entre comptes par défaut.","Elle n'est pas perdue grâce au partage.","Aucun remboursement.","Aucune conversion."]},
{t:"Tarification EC2",q:"Quel modèle de tarification offre des remises en échange d'un engagement de dépense horaire en dollars, applicable à EC2, Fargate et Lambda ?",o:["Compute Savings Plans","Instances réservées Standard","Instances Spot","Hôtes dédiés"],a:[0],e:["Le Compute Savings Plan couvre EC2 (toutes familles et régions), Fargate et Lambda.","Les réservées ne couvrent que EC2 (ou RDS, etc.), avec des attributs fixés.","Spot n'est pas un engagement.","Les hôtes dédiés ne couvrent pas Lambda."]},
{t:"Tarification EC2",q:"Quelles options d'achat EC2 impliquent un engagement de 1 ou 3 ans ? (2 réponses)",o:["Instances réservées","Savings Plans","Instances Spot","Instances à la demande","Réservations de capacité à la demande"],a:[0,1],e:["Les réservées exigent 1 ou 3 ans.","Les Savings Plans exigent 1 ou 3 ans.","Spot n'a pas d'engagement.","La demande n'a pas d'engagement.","Les réservations de capacité n'ont pas de durée minimale."]},
{t:"Tarification EC2",q:"Quelle option offre un matériel physique non partagé avec d'autres clients, sans donner de visibilité sur le serveur lui-même ?",o:["Instances dédiées","Hôtes dédiés","Instances Spot","Instances à la demande standard"],a:[0],e:["Les instances dédiées tournent sur du matériel réservé au client.","L'hôte dédié donne en plus la visibilité et le contrôle du serveur.","Spot partage le matériel.","Les instances standard partagent le matériel."]},
{t:"Transfert",q:"Quels transferts de données sont généralement gratuits sur AWS ? (2 réponses)",o:["Les données entrant dans AWS depuis internet","Les données entre instances d'une même AZ via IP privée","Les données sortant d'AWS vers internet","Les données entre deux régions","Les données entre deux AZ"],a:[0,1],e:["Le trafic entrant est gratuit.","Dans la même AZ en IP privée, c'est gratuit.","Le trafic sortant vers internet est payant.","Le trafic inter-régions est payant.","Le trafic entre AZ est faiblement payant."]},
{t:"Transfert",q:"Une entreprise copie chaque jour 10 To d'une région à une autre. Comment ce transfert est-il facturé ?",o:["Il est payant","Il est gratuit","Il est gratuit au sein d'Organizations","Il est inclus dans le plan de support"],a:[0],e:["Le transfert entre régions est facturé.","Il n'est pas gratuit.","Organizations ne rend pas ce trafic gratuit.","Le support n'inclut pas le transfert de données."]},
{t:"Tarification stockage",q:"Comment un volume Amazon EBS est-il facturé ?",o:["Au Go provisionné, même s'il est vide","Au Go réellement utilisé","Au nombre de lectures uniquement","Il est gratuit avec EC2"],a:[0],e:["On paie la taille du volume créé.","La facturation à l'usage réel, c'est EFS.","Les lectures ne sont pas le critère principal.","EBS est facturé séparément."]},
{t:"Tarification stockage",q:"Pourquoi une classe S3 très peu chère au stockage peut-elle coûter plus cher au total pour des données souvent lues ?",o:["Parce qu'elle facture des frais de récupération à chaque lecture","Parce qu'elle facture le trafic entrant","Parce qu'elle exige un plan de support","Parce qu'elle chiffre les données"],a:[0],e:["Les classes IA et Glacier facturent la récupération des données.","Le trafic entrant est gratuit.","Aucun plan de support n'est requis.","Le chiffrement ne change pas ce calcul."]},
{t:"Tarification stockage",q:"Quels facteurs déterminent le coût d'Amazon S3 ? (2 réponses)",o:["La classe de stockage et la quantité stockée","Le nombre de requêtes et le transfert sortant","Le nombre d'utilisateurs IAM","Le nombre d'AZ de la région","Le plan de support"],a:[0,1],e:["Chaque classe a son prix au Go.","Requêtes et transfert sortant sont facturés.","IAM est gratuit.","Pas un critère de prix.","Facturé séparément."]},
{t:"Coûts",q:"Une équipe veut recevoir un e-mail dès que ses dépenses mensuelles prévues dépassent 1 000 €. Quel service utiliser ?",o:["AWS Budgets","AWS Cost Explorer","AWS Pricing Calculator","AWS Artifact"],a:[0],e:["Budgets envoie des alertes sur les coûts réels ou prévus.","Cost Explorer analyse mais n'envoie pas d'alertes de budget.","Le calculateur estime avant de construire.","Artifact fournit des rapports de conformité."]},
{t:"Coûts",q:"Un directeur financier veut visualiser les dépenses AWS des 12 derniers mois par service et obtenir une prévision. Quel service choisir ?",o:["AWS Cost Explorer","AWS Budgets","AWS Pricing Calculator","AWS Trusted Advisor"],a:[0],e:["Cost Explorer visualise l'historique et fait des prévisions.","Budgets sert surtout aux alertes.","Le calculateur estime des architectures futures.","Trusted Advisor recommande des optimisations."]},
{t:"Coûts",q:"Une entreprise veut estimer le coût mensuel d'une architecture avant de la déployer. Quel outil utiliser ?",o:["AWS Pricing Calculator","AWS Cost Explorer","AWS Budgets","Le rapport d'utilisation et de coût"],a:[0],e:["Le calculateur de prix estime le coût d'une architecture future.","Cost Explorer analyse des dépenses déjà engagées.","Budgets suit des dépenses réelles.","Le CUR détaille des dépenses passées."]},
{t:"Coûts",q:"Quel est le rapport de facturation le plus détaillé, ligne par ligne et heure par heure, livré dans un bucket S3 ?",o:["Le rapport d'utilisation et de coût (CUR)","AWS Budgets","AWS Cost Explorer","Le tableau de bord AWS Health"],a:[0],e:["Le CUR est le niveau de détail maximum.","Budgets sert aux alertes.","Cost Explorer agrège pour la visualisation.","Health signale des événements de service."]},
{t:"Coûts",q:"Une entreprise veut répartir sa facture AWS par projet et par équipe. Que doit-elle utiliser ?",o:["Les balises de répartition des coûts","Les security groups","Les SCP","Les VPC endpoints"],a:[0],e:["Les balises (tags) classent les coûts par projet, équipe, client.","Les security groups filtrent le trafic.","Les SCP limitent les permissions.","Les endpoints concernent le réseau."]},
{t:"Coûts",q:"Une équipe a ajouté une balise Projet sur ses ressources, mais elle n'apparaît pas dans Cost Explorer. Pourquoi ?",o:["La balise doit être activée comme balise de répartition des coûts dans la console Facturation","Les balises ne fonctionnent qu'avec le plan Enterprise","Les balises sont limitées à S3","Il faut attendre la fin de l'année"],a:[0],e:["Une balise définie par l'utilisateur doit être activée pour apparaître dans les rapports.","Aucun plan de support n'est requis.","Les balises s'appliquent à la plupart des ressources.","L'activation suffit, avec un délai de quelques heures."]},
{t:"Coûts",q:"Quels types de balises de répartition des coûts existe-t-il ? (2 réponses)",o:["Les balises générées par AWS","Les balises définies par l'utilisateur","Les balises de région","Les balises de support","Les balises de conformité Artifact"],a:[0,1],e:["Par exemple aws:createdBy.","Créées par le client, préfixe user: dans les rapports.","Pas un type de balise de coûts.","Pas un type de balise de coûts.","Pas un type de balise de coûts."]},
{t:"Coûts",q:"Quels avantages offre la facturation consolidée d'AWS Organizations ? (2 réponses)",o:["Une seule facture pour tous les comptes","Le cumul de l'usage pour atteindre des paliers de remise sur volume","Un TAM dédié gratuit","La suppression des frais de transfert","Le plan Business gratuit"],a:[0,1],e:["Tous les comptes sont regroupés sur une facture.","L'usage cumulé atteint plus vite les paliers de prix dégressifs.","Le TAM dépend du plan Enterprise.","Le transfert reste facturé.","Le support reste payant."]},
{t:"Coûts",q:"Quel service recommande, grâce au machine learning, des tailles d'instances EC2 mieux adaptées à l'usage réel ?",o:["AWS Compute Optimizer","AWS Budgets","AWS Artifact","AWS Pricing Calculator"],a:[0],e:["Compute Optimizer analyse l'usage pour recommander le bon dimensionnement.","Budgets suit des montants.","Artifact fournit des rapports.","Le calculateur estime des coûts futurs."]},
{t:"Coûts",q:"Quels services peuvent identifier des opportunités de dimensionnement approprié (right-sizing) des instances EC2 ? (2 réponses)",o:["AWS Compute Optimizer","AWS Cost Explorer","AWS Artifact","Amazon Macie","AWS Shield"],a:[0,1],e:["Compute Optimizer fait des recommandations détaillées.","Cost Explorer propose aussi des recommandations de right-sizing.","Artifact fournit des rapports de conformité.","Macie détecte des données sensibles.","Shield protège des DDoS."]},
{t:"Support",q:"Quel plan de support est inclus gratuitement avec tout compte AWS ?",o:["Basic","Developer","Business","Enterprise On-Ramp"],a:[0],e:["Basic est gratuit : service client, documentation, re:Post.","Developer est payant.","Business est payant.","Enterprise On-Ramp est payant."]},
{t:"Support",q:"Quel est le plan de support le moins cher qui offre un accès 24/7 par téléphone, chat et e-mail à des ingénieurs support ?",o:["Business","Developer","Basic","Enterprise"],a:[0],e:["Business est le premier niveau avec accès technique 24/7.","Developer n'offre qu'un accès par e-mail en heures ouvrées.","Basic n'offre pas de support technique.","Enterprise offre ce service mais coûte plus cher."]},
{t:"Support",q:"Quel plan de support fournit un Technical Account Manager (TAM) dédié ?",o:["Enterprise","Enterprise On-Ramp","Business","Developer"],a:[0],e:["Seul Enterprise inclut un TAM dédié.","On-Ramp donne accès à un pool de TAM.","Business n'inclut pas de TAM.","Developer n'inclut pas de TAM."]},
{t:"Support",q:"Une entreprise veut un délai de réponse de 15 minutes maximum pour une panne de système critique pour l'activité. Quel plan choisir ?",o:["Enterprise","Enterprise On-Ramp","Business","Developer"],a:[0],e:["Enterprise garantit une réponse en moins de 15 minutes.","On-Ramp vise 30 minutes.","Business vise 1 heure pour un système de production à l'arrêt.","Developer n'a pas ce niveau de réponse."]},
{t:"Support",q:"Quel plan donne accès à un pool de Technical Account Managers et à un délai de réponse de 30 minutes pour un système critique ?",o:["Enterprise On-Ramp","Enterprise","Business","Developer"],a:[0],e:["On-Ramp offre un pool de TAM et une réponse en 30 minutes.","Enterprise offre un TAM dédié et 15 minutes.","Business n'a pas de TAM.","Developer n'a pas de TAM."]},
{t:"Support",q:"Quel plan est adapté à une équipe qui expérimente et teste AWS, avec un accès au support technique par e-mail en heures ouvrées ?",o:["Developer","Business","Enterprise","Basic"],a:[0],e:["Developer vise les environnements de test.","Business vise la production.","Enterprise vise les charges critiques.","Basic n'offre pas de support technique."]},
{t:"Support",q:"À partir de quel plan de support tous les contrôles AWS Trusted Advisor sont-ils disponibles ?",o:["Business","Developer","Basic","Seulement Enterprise"],a:[0],e:["Business et les plans supérieurs donnent accès à tous les contrôles.","Developer n'a que les contrôles de base.","Basic n'a que les contrôles de base.","Business suffit."]},
{t:"Support",q:"Dans quelles catégories AWS Trusted Advisor fait-il des recommandations ? (2 réponses)",o:["Optimisation des coûts","Sécurité","Traduction automatique","Reconnaissance d'images","Conception d'interfaces"],a:[0,1],e:["Par exemple les instances sous-utilisées.","Par exemple la MFA root ou les ports ouverts.","Hors périmètre.","Hors périmètre.","Hors périmètre."]},

{t:"Ressources",q:"Une entreprise reçoit des tentatives d'hameçonnage provenant d'adresses IP hébergées sur AWS. Qui doit-elle contacter ?",o:["L'équipe AWS Trust & Safety","Le TAM de l'entreprise","AWS Professional Services","Le Concierge"],a:[0],e:["Trust & Safety traite les signalements d'abus impliquant des ressources AWS.","Le TAM accompagne le compte du client, pas les abus de tiers.","Professional Services mène des projets.","Le Concierge s'occupe de la facturation."]},
{t:"Ressources",q:"Où trouver une communauté de questions-réponses officielle d'AWS, alimentée par des experts et des utilisateurs ?",o:["AWS re:Post","AWS Artifact","AWS Marketplace","AWS Health Dashboard"],a:[0],e:["re:Post est la communauté Q&R d'AWS.","Artifact fournit des rapports de conformité.","Marketplace vend des logiciels.","Health signale des événements de service."]},
{t:"Ressources",q:"Où trouver les réponses aux questions les plus fréquemment posées au support AWS ?",o:["AWS Knowledge Center","AWS Artifact","AWS Pricing Calculator","AWS CloudTrail"],a:[0],e:["Le Knowledge Center regroupe les questions fréquentes du support.","Artifact fournit des rapports.","Le calculateur estime des coûts.","CloudTrail audite des appels d'API."]},
{t:"Ressources",q:"Une entreprise cherche des guides, stratégies et modèles éprouvés par AWS pour planifier sa migration. Quelle ressource consulter ?",o:["AWS Prescriptive Guidance (Recommandations AWS)","AWS Artifact","AWS Shield","AWS Budgets"],a:[0],e:["Prescriptive Guidance propose des stratégies et modèles éprouvés.","Artifact fournit des rapports.","Shield protège des DDoS.","Budgets suit des dépenses."]},
{t:"Partenaires",q:"Une entreprise n'a pas les compétences internes pour migrer vers AWS et veut se faire accompagner. Quelles options sont adaptées ? (2 réponses)",o:["Faire appel à un partenaire intégrateur de l'AWS Partner Network","Faire appel à AWS Professional Services","Acheter un abonnement AWS Shield Advanced","Activer AWS Budgets","Utiliser AWS Artifact"],a:[0,1],e:["Les intégrateurs systèmes partenaires mènent des projets de migration.","Les Professional Services d'AWS accompagnent les grands projets.","Shield protège des DDoS.","Budgets suit des dépenses.","Artifact fournit des rapports."]},
{t:"Partenaires",q:"Une entreprise veut acheter un logiciel tiers prêt à déployer sur AWS, facturé directement sur sa facture AWS. Où le trouver ?",o:["AWS Marketplace","AWS Artifact","AWS Service Catalog","AWS re:Post"],a:[0],e:["Marketplace vend des logiciels tiers facturés via AWS.","Artifact fournit des rapports.","Service Catalog liste des produits internes pré-approuvés.","re:Post est une communauté."]},

{t:"D1 Concepts",q:"Une startup veut lancer son produit sans acheter de serveurs et payer uniquement ce qu'elle consomme. Quel avantage du cloud cela illustre-t-il ?",o:["Le passage de dépenses fixes à des dépenses variables","Les économies d'échelle","La tolérance aux pannes","La souveraineté des données"],a:[0],e:["Payer à l'usage sans investissement initial, c'est le passage CapEx vers OpEx.","Les économies d'échelle concernent la baisse des prix liée au volume d'AWS.","La tolérance aux pannes concerne la continuité.","La souveraineté concerne la localisation des données."]},
{t:"D1 Concepts",q:"Quel pilier Well-Architected est le plus concerné par la suppression des ressources inutilisées et le paiement à l'usage ?",o:["Optimisation des coûts","Fiabilité","Sécurité","Durabilité"],a:[0],e:["Mesurer et supprimer l'inutilisé est un principe de l'optimisation des coûts.","La fiabilité concerne les pannes.","La sécurité concerne la protection.","La durabilité recoupe en partie ce sujet mais vise l'impact environnemental."]},
{t:"D1 Concepts",q:"Une entreprise décide de garder une application sur site encore 2 ans car elle dépend d'un matériel spécifique. Quelle stratégie de migration est-ce ?",o:["Retain","Retire","Rehost","Repurchase"],a:[0],e:["Retain garde l'application en place pour l'instant.","Retire la supprimerait.","Rehost la migrerait.","Repurchase la remplacerait par un SaaS."]},
{t:"D1 Concepts",q:"Une entreprise veut déplacer ses machines virtuelles VMware vers AWS sans les modifier ni changer d'outils. Quelle stratégie est-ce ?",o:["Relocate","Refactor","Replatform","Retire"],a:[0],e:["Relocate déplace des VM VMware telles quelles (VMware Cloud on AWS).","Refactor réécrit l'application.","Replatform apporte une optimisation.","Retire supprime l'application."]},
{t:"D1 Concepts",q:"Quel pilier Well-Architected recommande d'utiliser des instances plus efficaces, comme celles basées sur Graviton, pour réduire l'énergie consommée ?",o:["Durabilité","Fiabilité","Excellence opérationnelle","Sécurité"],a:[0],e:["Réduire la consommation d'énergie relève de la durabilité.","La fiabilité concerne la reprise après panne.","L'excellence opérationnelle concerne les opérations.","La sécurité concerne la protection."]},
{t:"D1 Concepts",q:"Quelle perspective du Cloud Adoption Framework couvre l'architecture technique et la mise en place de la plateforme cloud ?",o:["Platform","People","Business","Governance"],a:[0],e:["Platform couvre l'architecture et l'infrastructure.","People couvre la culture et les compétences.","Business couvre la valeur métier.","Governance couvre les risques et les budgets."]},
{t:"D1 Concepts",q:"Quels éléments font partie de l'économie du cloud ? (2 réponses)",o:["Dimensionner les ressources selon l'usage réel","Automatiser pour réduire les coûts d'exploitation","Acheter du matériel 3 ans à l'avance","Construire son propre datacenter","Prévoir la capacité pour le pic maximum en permanence"],a:[0,1],e:["Le right-sizing évite de payer pour rien.","L'automatisation réduit les coûts humains et les erreurs.","C'est le modèle on-prem.","C'est le modèle on-prem.","C'est ce que le cloud permet d'éviter."]},
{t:"D1 Concepts",q:"Une application continue de fonctionner sans aucune interruption pendant la panne d'un composant. Quelle notion cela décrit-il ?",o:["La tolérance aux pannes","L'élasticité","L'agilité","La scalabilité verticale"],a:[0],e:["La tolérance aux pannes signifie zéro interruption malgré une panne.","L'élasticité concerne l'ajustement de capacité.","L'agilité concerne la rapidité d'expérimentation.","La scalabilité verticale consiste à agrandir une machine."]},
{t:"D1 Concepts",q:"Quel service aide à construire le business case et à estimer le TCO avant une migration vers AWS ?",o:["Migration Evaluator","AWS Budgets","AWS Cost Explorer","AWS Artifact"],a:[0],e:["Migration Evaluator estime les économies d'une migration.","Budgets suit des dépenses existantes.","Cost Explorer analyse des dépenses AWS passées.","Artifact fournit des rapports."]},
{t:"D1 Concepts",q:"Une entreprise migre un site historique vers AWS Snowball parce qu'elle doit transférer 80 To et dispose d'un débit internet limité. De quelle tâche du programme s'agit-il ?",o:["Identifier une stratégie de migration appropriée","Définir les piliers Well-Architected","Comparer les plans de support","Configurer IAM"],a:[0],e:["Le guide cite Snowball comme exemple de stratégie de migration.","Les piliers concernent la conception.","Le support relève du domaine 4.","IAM relève du domaine 2."]},
{t:"D1 Concepts",q:"Quel pilier Well-Architected est le plus concerné par l'automatisation des opérations et l'apprentissage à partir des échecs ?",o:["Excellence opérationnelle","Optimisation des coûts","Sécurité","Efficacité des performances"],a:[0],e:["L'excellence opérationnelle prône l'automatisation et l'amélioration continue.","Les coûts sont un autre pilier.","La sécurité concerne la protection.","La performance concerne l'usage des ressources."]},
{t:"D1 Concepts",q:"Quel avantage AWS met-il en avant en disant qu'une entreprise peut se concentrer sur ses clients plutôt que sur l'entretien de ses serveurs ?",o:["Arrêter de dépenser de l'argent pour faire tourner des datacenters","Profiter de la responsabilité totale d'AWS sur les données","Obtenir un TAM gratuit","Supprimer le besoin de sécurité"],a:[0],e:["C'est l'un des 6 avantages du cloud.","Les données restent sous la responsabilité du client.","Le TAM dépend du plan de support.","La sécurité reste nécessaire."]},
{t:"D2 Sécurité",q:"Sur Amazon EC2, qui est responsable de la configuration du pare-feu de l'OS invité ?",o:["Le client","AWS","AWS et le client à parts égales","Un partenaire certifié"],a:[0],e:["L'OS invité et sa configuration appartiennent au client.","AWS ne gère pas l'OS invité sur EC2.","Ce n'est pas un contrôle partagé.","Aucun partenaire n'est requis."]},
{t:"D2 Sécurité",q:"Une entreprise a besoin de rapports prouvant qu'AWS est conforme à la norme ISO 27001. Quel service utiliser ?",o:["AWS Artifact","AWS Config","Amazon Inspector","AWS CloudTrail"],a:[0],e:["Artifact fournit les rapports de conformité d'AWS.","Config évalue les ressources du client.","Inspector cherche des vulnérabilités.","CloudTrail audite des appels d'API."]},
{t:"D2 Sécurité",q:"Un développeur a besoin d'un accès en ligne de commande à AWS. Que doit-il utiliser ?",o:["Des clés d'accès d'un utilisateur IAM ou des identifiants temporaires","Le mot de passe de la console root","Une clé KMS","Un certificat ACM"],a:[0],e:["Les clés d'accès ou des identifiants temporaires servent à la CLI.","Le root ne doit jamais être utilisé ainsi.","Une clé KMS chiffre des données.","Un certificat ACM sert au TLS."]},
{t:"D2 Sécurité",q:"Quelles bonnes pratiques IAM réduisent le risque de compromission ? (2 réponses)",o:["Activer la MFA pour les utilisateurs privilégiés","Faire tourner régulièrement les clés d'accès","Partager les comptes entre collègues","Donner AdministratorAccess à tous","Stocker les clés d'accès dans le code source"],a:[0,1],e:["La MFA bloque l'usage d'un mot de passe volé.","La rotation limite la durée d'exploitation d'une clé volée.","Le partage empêche la traçabilité.","Contraire au moindre privilège.","Les clés dans le code fuitent facilement."]},
{t:"D2 Sécurité",q:"Une entreprise veut savoir quels services un utilisateur IAM a réellement utilisés, pour retirer les permissions inutiles. Quel outil IAM l'aide ?",o:["L'Access Advisor (dernier accès aux services)","AWS Artifact","AWS Budgets","Amazon Polly"],a:[0],e:["L'Access Advisor montre les services réellement utilisés.","Artifact fournit des rapports.","Budgets suit des dépenses.","Polly synthétise la voix."]},
{t:"D2 Sécurité",q:"Une société de e-commerce veut bloquer le trafic web venant de certains pays et limiter le nombre de requêtes par IP. Quel service choisir ?",o:["AWS WAF","AWS Shield Standard","Amazon GuardDuty","AWS Config"],a:[0],e:["WAF filtre par géographie et limite le débit de requêtes.","Shield Standard protège des DDoS réseau, sans règles personnalisées.","GuardDuty détecte, il ne bloque pas.","Config suit des configurations."]},
{t:"D2 Sécurité",q:"GuardDuty signale qu'une instance communique avec une adresse IP connue pour du minage de cryptomonnaie. Quel type de service est GuardDuty ?",o:["Un service de détection de menaces","Un scanner de vulnérabilités","Un pare-feu applicatif","Un service de gestion de clés"],a:[0],e:["GuardDuty détecte des comportements malveillants.","Le scanner de vulnérabilités, c'est Inspector.","Le pare-feu applicatif, c'est WAF.","La gestion de clés, c'est KMS."]},
{t:"D2 Sécurité",q:"Quel service permet de chiffrer les données au repos dans S3, EBS et RDS avec des clés dont on contrôle l'usage via des policies ?",o:["AWS KMS","AWS Shield","Amazon Cognito","AWS Firewall Manager"],a:[0],e:["KMS gère les clés et leurs autorisations d'usage.","Shield protège des DDoS.","Cognito gère des utilisateurs d'applis.","Firewall Manager centralise des règles."]},
{t:"D2 Sécurité",q:"Une équipe veut un tableau de bord unique regroupant les alertes de sécurité de tous ses comptes. Quel service choisir ?",o:["AWS Security Hub","Amazon Detective","AWS Shield Advanced","AWS Artifact"],a:[0],e:["Security Hub agrège les résultats de sécurité.","Detective sert à enquêter.","Shield Advanced protège des DDoS.","Artifact fournit des rapports."]},
{t:"D2 Sécurité",q:"Quel service surveille et enregistre les appels d'API pour assurer la traçabilité exigée par un audit ?",o:["AWS CloudTrail","Amazon CloudWatch","AWS X-Ray","Amazon Inspector"],a:[0],e:["CloudTrail fournit la piste d'audit des actions.","CloudWatch surveille les performances.","X-Ray trace les requêtes applicatives.","Inspector cherche des vulnérabilités."]},
{t:"D2 Sécurité",q:"Une entreprise doit stocker des clés d'API tierces et les faire tourner automatiquement tous les 30 jours. Quel service choisir ?",o:["AWS Secrets Manager","AWS Certificate Manager","Amazon Macie","AWS Artifact"],a:[0],e:["Secrets Manager stocke et fait tourner les secrets.","ACM gère des certificats TLS.","Macie détecte des données sensibles.","Artifact fournit des rapports."]},
{t:"D2 Sécurité",q:"Dans une organisation, quel mécanisme empêche un compte membre de désactiver CloudTrail, même pour son utilisateur root ?",o:["Une Service Control Policy (SCP)","Un security group","Une Network ACL","Un rôle IAM inter-comptes"],a:[0],e:["Les SCP s'imposent à tout le compte membre, root compris.","Un security group filtre le trafic.","Une NACL filtre le trafic.","Un rôle donne un accès, il ne restreint pas un compte."]},
{t:"D2 Sécurité",q:"Où trouver des solutions de sécurité tierces pour compléter les services de sécurité AWS ?",o:["AWS Marketplace","AWS Config","AWS Budgets","Amazon Lightsail"],a:[0],e:["Marketplace propose des produits de sécurité tiers.","Config suit des configurations.","Budgets suit des dépenses.","Lightsail est un serveur virtuel."]},
{t:"D2 Sécurité",q:"Sur AWS Fargate, qui gère les correctifs du système d'exploitation sous-jacent ?",o:["AWS","Le client","Le partenaire qui a vendu l'image","Personne"],a:[0],e:["Fargate est sans serveur : AWS gère l'OS sous-jacent.","Le client gère ses images de conteneurs et son code.","Aucun partenaire n'est impliqué.","Les correctifs sont bien appliqués, par AWS."]},
{t:"D2 Sécurité",q:"Quels services aident à protéger une application contre des attaques venant d'internet ? (2 réponses)",o:["AWS Shield","AWS WAF","AWS Glue","Amazon Translate","AWS Batch"],a:[0,1],e:["Shield protège des DDoS.","WAF filtre les requêtes web malveillantes.","Glue fait de l'ETL.","Translate traduit.","Batch exécute des traitements."]},
{t:"D2 Sécurité",q:"Une entreprise veut que ses employés accèdent à AWS avec leurs identifiants Microsoft Entra ID (Azure AD) existants via SAML. Quel service AWS facilite cela pour plusieurs comptes ?",o:["AWS IAM Identity Center","Amazon Cognito","AWS Secrets Manager","AWS Shield"],a:[0],e:["Identity Center fédère un fournisseur d'identité externe pour plusieurs comptes.","Cognito vise les utilisateurs finaux d'une appli.","Secrets Manager stocke des secrets.","Shield protège des DDoS."]},
{t:"D3 Technologie",q:"Une application doit rester disponible même si une région AWS entière devient indisponible. Quelle architecture choisir ?",o:["Déployer dans plusieurs régions","Déployer dans plusieurs AZ d'une seule région","Utiliser une seule instance plus puissante","Utiliser une Local Zone"],a:[0],e:["Seul le multi-région protège d'une panne régionale.","Le multi-AZ protège d'une panne d'AZ, pas de région.","Une instance reste un point de défaillance unique.","Une Local Zone dépend de sa région parente."]},
{t:"D3 Technologie",q:"Une application web stateless subit des pics de trafic le soir. Quelle combinaison absorbe automatiquement ces pics ?",o:["Elastic Load Balancing et EC2 Auto Scaling","Amazon EBS et AWS Backup","Amazon Route 53 et AWS Artifact","AWS KMS et AWS CloudHSM"],a:[0],e:["Le load balancer répartit et Auto Scaling ajoute des instances.","EBS et Backup concernent le stockage.","Artifact fournit des rapports.","KMS et CloudHSM concernent le chiffrement."]},
{t:"D3 Technologie",q:"Une équipe veut exécuter du code toutes les 5 minutes pour vérifier un site, sans gérer de serveur. Quelle combinaison choisir ?",o:["Amazon EventBridge (planification) et AWS Lambda","Amazon SQS et Amazon EBS","AWS Batch et Amazon FSx","Amazon CloudFront et S3 Glacier"],a:[0],e:["EventBridge planifie et Lambda exécute, sans serveur.","SQS et EBS ne planifient pas d'exécution.","Batch vise des traitements lourds et FSx des fichiers.","CloudFront et Glacier n'exécutent pas de code planifié."]},
{t:"D3 Technologie",q:"Une base de données a besoin d'une latence inférieure à la milliseconde pour des lectures de sessions utilisateurs. Quel service ajouter ?",o:["Amazon ElastiCache","Amazon Redshift","Amazon S3 Glacier","Amazon Athena"],a:[0],e:["ElastiCache offre des latences de l'ordre de la microseconde.","Redshift est fait pour l'analytique.","Glacier est fait pour l'archive.","Athena interroge S3, avec des secondes de latence."]},
{t:"D3 Technologie",q:"Des photos uploadées par des utilisateurs doivent être stockées de façon durable et économique, avec un accès fréquent les 30 premiers jours puis rare. Quelle solution choisir ?",o:["S3 Standard avec une règle de cycle de vie vers S3 Standard-IA","EBS Provisioned IOPS","Stockage d'instance","S3 Glacier Deep Archive dès le départ"],a:[0],e:["Le cycle de vie déplace automatiquement les objets vers une classe moins chère.","EBS est cher et lié à une instance.","Le stockage d'instance est éphémère.","Deep Archive empêcherait l'accès fréquent du début."]},
{t:"D3 Technologie",q:"Quel service DNS peut rediriger automatiquement les utilisateurs vers un site de secours si le site principal ne répond plus ?",o:["Amazon Route 53 avec routage par basculement","Amazon CloudFront","AWS Direct Connect","Elastic Load Balancing seul"],a:[0],e:["Route 53 combine contrôles de santé et basculement.","CloudFront est un CDN.","Direct Connect est une liaison réseau.","Un load balancer travaille dans une région, il ne bascule pas au niveau DNS."]},
{t:"D3 Technologie",q:"Une entreprise veut une liaison réseau privée avec un débit garanti entre son datacenter et AWS, et un VPN comme secours. Quels services utiliser ? (2 réponses)",o:["AWS Direct Connect","AWS Site-to-Site VPN","Amazon CloudFront","AWS Global Accelerator","Amazon Route 53"],a:[0,1],e:["Direct Connect fournit la liaison privée dédiée.","Le VPN site à site sert de lien de secours via internet.","CloudFront est un CDN.","Global Accelerator vise les utilisateurs internet.","Route 53 est un DNS."]},

{t:"D3 Technologie",q:"Une équipe veut compiler son code et exécuter ses tests unitaires automatiquement à chaque commit. Quel service choisir ?",o:["AWS CodeBuild","AWS X-Ray","Amazon Inspector","AWS Artifact"],a:[0],e:["CodeBuild compile et teste le code.","X-Ray trace des requêtes en production.","Inspector cherche des vulnérabilités.","Artifact fournit des rapports."]},

const MOD_SIZE=10; // questions par module
const MODS_PER_DAY=5; // 5 modules × 10 q = 50 q/jour

const KEY="clf7.v2";
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
store.r=store.r||{}; // results: "day-idx" -> 1 correct / 0 wrong
store.free=store.free||{}; // free training config persistence

function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const Q=(d,i)=>window.QDATA[d][i];
const total=()=>Object.values(window.QDATA).reduce((s,a)=>s+a.length,0);
const errors=()=>Object.keys(store.r).filter(k=>store.r[k]===0).map(k=>k.split("-").map(Number));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L="ABCDE";

// Module index: day d, module m (0-based) → questions [start..end)
function modRange(d,m){const start=m*MOD_SIZE;return{start,end:Math.min(start+MOD_SIZE,window.QDATA[d].length)}}
function modStats(d,m){
  const{start,end}=modRange(d,m);let done=0,ok=0;
  for(let i=start;i<end;i++){const v=store.r[d+"-"+i];if(v!==undefined){done++;if(v===1)ok++;}}
  return{n:end-start,done,ok}
}
function dayModCount(d){return Math.ceil(window.QDATA[d].length/MOD_SIZE)}

function header(){
  const keys=Object.keys(store.r),ok=keys.filter(k=>store.r[k]===1).length;
  document.getElementById("sDone").textContent=keys.length+"/"+total();
  document.getElementById("sRate").textContent=keys.length?Math.round(ok/keys.length*100)+" %":"–";
  const n=errors().length,b=document.getElementById("errBadge");
  b.hidden=!n;b.textContent=n;
}
function dayStats(d){
  const n=window.QDATA[d].length;let done=0,ok=0;
  for(let i=0;i<n;i++){const v=store.r[d+"-"+i];if(v!==undefined){done++;if(v===1)ok++}}
  return{n,done,ok}
}

let tab="plan",session=null,timerId=null;
function setTab(t){
  tab=t;
  [["plan","tabPlan"],["quiz","tabQuiz"],["free","tabFree"],["err","tabErr"]].forEach(([k,id])=>document.getElementById(id).setAttribute("aria-selected",k===t));
  render();
}
document.getElementById("tabPlan").onclick=()=>setTab("plan");
document.getElementById("tabQuiz").onclick=()=>setTab("quiz");
document.getElementById("tabFree").onclick=()=>setTab("free");
document.getElementById("tabErr").onclick=()=>setTab("err");

function render(){
  header();
  const v=document.getElementById("view");
  if(tab==="plan")v.innerHTML=planHTML();
  else if(tab==="err")v.innerHTML=errHTML();
  else if(tab==="free")v.innerHTML=session?(session.done?resultHTML():qHTML()):freeHTML();
  else v.innerHTML=session?(session.done?resultHTML():qHTML()):pickHTML();
  bind();
}

/* ── PLAN ─────────────────────────────────────────────── */
function dotClass(d,m){
  const s=modStats(d,m);
  if(s.done===s.n)return "moddot done";
  if(s.done>0)return "moddot partial";
  return "moddot";
}
function planHTML(){
  return `<p class="intro">Une semaine, un bloc de domaine par jour, pondéré comme l'examen. Chaque jour est découpé en <b>5 modules de 10 questions</b>. Lis les sections de <a href="${DOC}" target="_blank" rel="noopener">ta fiche de révision</a>, puis fais les modules un par un.</p>
  <div class="rules">
    <div><b class="num">65 q · 90 min</b><span>dont 15 non notées</span></div>
    <div><b class="num">700 / 1000</b><span>score de réussite</span></div>
    <div><b class="num">0 pénalité</b><span>ne jamais laisser vide</span></div>
    <div><b class="num">D3 › D2 › D1 › D4</b><span>34 · 30 · 24 · 12 %</span></div>
  </div>
  <ol class="days">${PLAN.map(p=>{
    const s=dayStats(p.d),pct=Math.round(s.done/s.n*100);
    const nm=dayModCount(p.d);
    const dots=Array.from({length:nm},(_,m)=>`<span class="${dotClass(p.d,m)}" title="Module ${m+1}"></span>`).join("");
    const modBtns=Array.from({length:nm},(_,m)=>{
      const ms=modStats(p.d,m);
      let cls=ms.done===ms.n?"btn sec":"btn"+(ms.done>0&&ms.done<ms.n?" ghost":"");
      const label=ms.done===ms.n?`M${m+1} ✓`:ms.done>0?`M${m+1} →`:`M${m+1}`;
      const tip=ms.done?` · ${Math.round(ms.ok/ms.done*100)}%`:"";
      return `<button class="${cls}" data-mod="${p.d}-${m}" title="Module ${m+1} : q${m*MOD_SIZE+1}–${Math.min((m+1)*MOD_SIZE,s.n)}${tip}" style="padding:6px 10px;font-size:.82rem">${label}</button>`;
    }).join("");
    return `<li class="day"><div class="tag"><span>Jour</span><b>${p.d}</b></div><div class="body">
      <div><h2>${esc(p.theme)}</h2><div class="chips" style="margin-top:6px">${p.dom.map(x=>`<span class="chip">${x}</span>`).join("")}<span class="chip" style="background:transparent;color:var(--muted)">${p.time}</span></div></div>
      <div class="cols"><div><h3>À lire</h3><ul>${p.read.map(r=>`<li>${esc(r)}</li>`).join("")}${p.links.map(l=>`<li><a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])}</a></li>`).join("")}</ul></div>
      <div><h3>À retenir</h3><ul>${p.focus.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div></div>
      ${p.extra?`<div style="font-size:.88rem"><b>+</b> ${esc(p.extra)}</div>`:""}
      <div class="dayfoot">
        <div class="prog"><div class="moddots">${dots}</div><div class="bar" style="max-width:160px"><i style="width:${pct}%"></i></div><span class="num" style="font-size:.8rem">${s.done}/${s.n}${s.done?` · ${Math.round(s.ok/s.done*100)} %`:""}</span></div>
        <div class="row" style="gap:6px">${modBtns}<button class="btn ghost" data-start="${p.d}" style="padding:6px 10px;font-size:.82rem">Tout J${p.d}</button></div>
      </div>
    </div></li>`;
  }).join("")}</ol>
  <p class="note">Ta progression est enregistrée dans ce navigateur uniquement. Les questions sont originales, écrites à partir du guide d'examen officiel CLF-C02 ; elles ne reproduisent pas de questions d'examen réelles.</p>`;
}

/* ── QUIZ PICK ─────────────────────────────────────────── */
function pickHTML(){
  return `<p class="intro">Choisis un module ou un lot complet. Les options sont mélangées à chaque passage.</p>
  <div class="days">${PLAN.map(p=>{
    const s=dayStats(p.d);
    const nm=dayModCount(p.d);
    const modBtns=Array.from({length:nm},(_,m)=>{
      const ms=modStats(p.d,m);
      const isDone=ms.done===ms.n;
      const cls=isDone?"btn sec":"btn"+(ms.done>0?" ghost":"");
      return `<button class="${cls}" data-mod="${p.d}-${m}" style="padding:6px 10px;font-size:.82rem" title="q${m*MOD_SIZE+1}–${Math.min((m+1)*MOD_SIZE,s.n)} · ${ms.done}/${ms.n} faites">M${m+1}${isDone?" ✓":ms.done>0?" →":""}</button>`;
    }).join("");
    return `<div class="day"><div class="tag"><span>Jour</span><b>${p.d}</b></div><div class="body"><h2>${esc(p.theme)}</h2>
      <div class="dayfoot">
        <span class="num" style="font-size:.8rem;color:var(--muted)">${s.done}/${s.n} faites${s.done?` · ${Math.round(s.ok/s.done*100)} %`:""}</span>
        <div class="row" style="gap:6px">${modBtns}<button class="btn ghost" data-start="${p.d}" style="padding:6px 10px;font-size:.82rem">Tout J${p.d}</button>
        ${s.done&&s.done<s.n?`<button class="btn sec" data-rest="${p.d}" style="padding:6px 10px;font-size:.82rem">Restantes</button>`:""}</div>
      </div>
    </div></div>`;
  }).join("")}</div>`;
}

/* ── FREE SESSION ──────────────────────────────────────── */
function freeHTML(){
  const cfg=store.free;
  const allDays=[1,2,3,4,5,6,7];
  const days=cfg.days||allDays;
  const n=cfg.n||30;
  const pool=buildFreePool(days);
  return `<div class="free-panel">
    <div class="eyebrow" style="margin-bottom:4px">Session d'entraînement libre</div>
    <h2>Configure ta session</h2>
    <div class="free-opts">
      <div class="free-row">
        <label>Nombre de questions</label>
        <input type="number" id="freeN" value="${n}" min="5" max="350" step="5" style="width:80px">
        <div class="preset-btns">
          <button data-preset="10">10</button>
          <button data-preset="20">20</button>
          <button data-preset="30">30</button>
          <button data-preset="50">50</button>
          <button data-preset="65">65</button>
        </div>
      </div>
      <div class="free-row" style="align-items:flex-start">
        <label style="padding-top:4px">Jours sources</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${allDays.map(d=>`<label style="display:flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer;font-weight:400;min-width:0"><input type="checkbox" id="fd${d}" ${days.includes(d)?"checked":""} data-fd="${d}" style="accent-color:var(--accent)"> J${d}</label>`).join("")}
        </div>
      </div>
      <div class="free-row">
        <label>Pioche parmi</label>
        <span class="tally" id="freeTally">${Math.min(n,pool.length)} / ${pool.length} questions disponibles</span>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="freeLaunch" ${pool.length<1?"disabled":""}>Lancer ${Math.min(n,pool.length)} questions</button>
      <button class="btn ghost" data-home>Retour au plan</button>
    </div>
  </div>
  <p class="note">En session libre, tes résultats <b>ne</b> sont <b>pas</b> enregistrés dans ta progression quotidienne. C'est du bonus pur.</p>`;
}

function buildFreePool(days){
  const pool=[];
  days.forEach(d=>{
    if(!window.QDATA[d])return;
    window.QDATA[d].forEach((_,i)=>pool.push([d,i]));
  });
  return pool;
}

/* ── ERRORS ────────────────────────────────────────────── */
function errHTML(){
  const e=errors();
  if(!e.length)return `<div class="empty"><h2 style="margin-bottom:6px">Aucune erreur en attente</h2>Les questions ratées apparaîtront ici. Une question réussie au rejeu sort de la liste.</div>`;
  const byDay={};e.forEach(([d])=>byDay[d]=(byDay[d]||0)+1);
  return `<p class="intro">${e.length} question${e.length>1?"s":""} à revoir. Rejoue-les jusqu'à ce que la liste soit vide.</p>
  <div class="row" style="margin-bottom:16px"><button class="btn" data-replay="all">Rejouer les ${e.length} erreurs</button></div>
  <ul class="missed">${e.slice(0,60).map(([d,i])=>`<li><span class="eyebrow">J${d} · ${esc(Q(d,i).t)}</span><br>${esc(Q(d,i).q)}</li>`).join("")}</ul>
  ${e.length>60?`<p class="note">… et ${e.length-60} autres.</p>`:""}`;
}

/* ── SESSION ───────────────────────────────────────────── */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(items,label,timed,isLive){
  // isLive = free session (don't persist results)
  session={
    items:items.map(([d,i])=>({d,i,order:shuffle(Q(d,i).o.map((_,k)=>k))})),
    idx:0,sel:[],checked:false,score:0,missed:[],label,done:false,
    end:timed?Date.now()+70*60*1000:null,
    isLive:!!isLive
  };
  clearInterval(timerId);
  if(timed)timerId=setInterval(tick,1000);
  if(tab==="free"){}else tab="quiz";
  render();
}

function tick(){
  if(!session||!session.end)return;
  const left=Math.max(0,session.end-Date.now()),el=document.getElementById("timer");
  if(el)el.textContent=fmt(left);
  if(left===0){clearInterval(timerId);session.done=true;render()}
}
const fmt=ms=>{const s=Math.ceil(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};

/* ── Q RENDER ──────────────────────────────────────────── */
function qHTML(){
  const it=session.items[session.idx],q=Q(it.d,it.i),need=q.a.length,multi=need>1;
  const opts=it.order.map((k,pos)=>{
    let cls="opt"+(multi?" sq":"");const sel=session.sel.includes(k);
    if(session.checked){if(q.a.includes(k))cls+=" good";else if(sel)cls+=" bad"}else if(sel)cls+=" sel";
    return `<button class="${cls}" data-opt="${k}" ${session.checked?"disabled":""}><span class="bub">${L[pos]}</span><span>${esc(q.o[k])}${session.checked?`<span class="why" style="display:block">${q.a.includes(k)?"✓ ":"✗ "}${esc(q.e[k])}</span>`:""}</span></button>`}).join("");
  const ok=session.checked&&isRight(q,session.sel);
  const liveBadge=session.isLive?`<span class="chip" style="background:var(--ok-soft);color:var(--ok);font-size:.7rem">Session libre</span>`:"";
  return `<div class="qhead">${liveBadge}<span class="eyebrow">${esc(session.label)} · ${esc(q.t)}</span>
    <span class="num" style="font-size:.85rem;color:var(--muted)">${session.idx+1} / ${session.items.length} · ${session.score} juste${session.score>1?"s":""}${session.end?` · <span id="timer" class="timer">${fmt(session.end-Date.now())}</span>`:""}</span></div>
  <div class="bar" style="max-width:none;margin-bottom:14px"><i style="width:${session.idx/session.items.length*100}%"></i></div>
  <div class="qcard"><p class="qtext">${esc(q.q.replace(/ \(2 réponses\)/,""))}</p>${multi?`<div class="multi">Choisis ${need} réponses</div>`:""}
  <div class="opts">${opts}</div>
  ${session.checked?`<div class="verdict ${ok?"ok":"ko"}">${ok?"Bonne réponse.":"Raté. Relis l'explication de chaque option."}</div>`:""}
  <div class="qnav"><button class="btn ghost" data-quit>Arrêter</button>
  ${session.checked?`<button class="btn" data-next>${session.idx+1<session.items.length?"Question suivante":"Voir le résultat"}</button>`:`<button class="btn" data-check ${session.sel.length!==need?"disabled":""}>Valider</button>`}</div></div>`;
}
const isRight=(q,sel)=>sel.length===q.a.length&&sel.every(k=>q.a.includes(k));

/* ── RESULT ────────────────────────────────────────────── */
function resultHTML(){
  const n=session.items.length,answered=session.idx+(session.checked?1:0),pct=answered?Math.round(session.score/answered*100):0;
  const msg=pct>=80?"Niveau examen atteint sur ce lot.":pct>=70?"Juste au-dessus de la barre. Rejoue tes erreurs.":"En dessous de l'objectif. Relis les sections de la fiche puis rejoue tes erreurs.";
  const liveNote=session.isLive?`<p style="font-size:.85rem;color:var(--muted)">Session libre — résultats <b>non comptabilisés</b> dans ta progression quotidienne.</p>`:"";
  return `<div class="result"><span class="eyebrow">${esc(session.label)} · terminé</span>
   <div class="score num" style="color:${pct>=80?"var(--ok)":pct>=70?"var(--accent)":"var(--ko)"}">${pct} %</div>
   <div>${session.score} bonnes réponses sur ${answered}${answered<n?` (${n-answered} non traitées)`:""}. ${msg}</div>
   ${liveNote}
   ${session.missed.length?`<h3 style="font-size:1rem">À revoir</h3><ul class="missed">${session.missed.map(([d,i])=>`<li>${esc(Q(d,i).q)}</li>`).join("")}</ul>`:""}
   <div class="row">${session.missed.length&&!session.isLive?`<button class="btn" data-replay="session">Rejouer ces ${session.missed.length} erreurs</button>`:""}<button class="btn ghost" data-home>Retour au plan</button>${tab==="free"?`<button class="btn sec" data-backfree>Nouvelle session libre</button>`:""}</div></div>`;
}

/* ── BIND ──────────────────────────────────────────────── */
function bind(){
  // Plan tab: start full day
  document.querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.start,p=PLAN[d-1];
    start(window.QDATA[d].map((_,i)=>[d,i]),"Jour "+d,!!p.timed);
  });
  // Plan tab: start a module
  document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{
    const[ds,ms]=b.dataset.mod.split("-"),d=+ds,m=+ms;
    const{start:s,end:e}=modRange(d,m);
    const items=Array.from({length:e-s},(_,k)=>[d,s+k]);
    start(items,`Jour ${d} · Module ${m+1}`);
  });
  // Rest of day
  document.querySelectorAll("[data-rest]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.rest;
    start(window.QDATA[d].map((_,i)=>[d,i]).filter(([,i])=>store.r[d+"-"+i]===undefined),"Jour "+d+" · restantes");
  });
  // Replay errors
  document.querySelectorAll("[data-replay]").forEach(b=>b.onclick=()=>{
    const items=b.dataset.replay==="all"?shuffle(errors()):session.missed.slice();
    start(items,"Rejeu des erreurs");
  });
  // Options
  document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.opt,q=Q(session.items[session.idx].d,session.items[session.idx].i);
    if(q.a.length===1)session.sel=[k];
    else session.sel=session.sel.includes(k)?session.sel.filter(x=>x!==k):session.sel.length<q.a.length?[...session.sel,k]:session.sel;
    render();
  });
  // Check
  const c=document.querySelector("[data-check]");
  if(c)c.onclick=()=>{
    const it=session.items[session.idx],q=Q(it.d,it.i),ok=isRight(q,session.sel);
    session.checked=true;
    if(ok)session.score++;else session.missed.push([it.d,it.i]);
    // Only persist to store.r if NOT a live session
    if(!session.isLive){store.r[it.d+"-"+it.i]=ok?1:0;save();}
    render();
  };
  // Next
  const nx=document.querySelector("[data-next]");
  if(nx)nx.onclick=()=>{
    if(session.idx+1<session.items.length){session.idx++;session.sel=[];session.checked=false}
    else{session.done=true;clearInterval(timerId);}
    render();window.scrollTo(0,0);
  };
  // Quit
  const qt=document.querySelector("[data-quit]");
  if(qt)qt.onclick=()=>{session.done=true;clearInterval(timerId);render()};
  // Home
  document.querySelectorAll("[data-home]").forEach(h=>h.onclick=()=>{session=null;setTab("plan")});
  // Back to free config
  const bf=document.querySelector("[data-backfree]");
  if(bf)bf.onclick=()=>{session=null;setTab("free")};

  // FREE SESSION CONFIG
  const freeN=document.getElementById("freeN");
  if(freeN){
    function syncFree(){
      const days=[];
      [1,2,3,4,5,6,7].forEach(d=>{const cb=document.getElementById("fd"+d);if(cb&&cb.checked)days.push(d)});
      const n=Math.max(5,Math.min(350,parseInt(freeN.value)||30));
      store.free={days,n};save();
      const pool=buildFreePool(days);
      const t=document.getElementById("freeTally");
      if(t)t.textContent=`${Math.min(n,pool.length)} / ${pool.length} questions disponibles`;
      const fl=document.getElementById("freeLaunch");
      if(fl){fl.disabled=pool.length<1;fl.textContent=`Lancer ${Math.min(n,pool.length)} questions`;}
    }
    freeN.oninput=syncFree;
    document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{freeN.value=b.dataset.preset;syncFree()});
    [1,2,3,4,5,6,7].forEach(d=>{const cb=document.getElementById("fd"+d);if(cb)cb.onchange=syncFree});
    const fl=document.getElementById("freeLaunch");
    if(fl)fl.onclick=()=>{
      const days=store.free.days||[1,2,3,4,5,6,7];
      const n=store.free.n||30;
      const pool=shuffle(buildFreePool(days)).slice(0,n);
      start(pool,"Session libre ("+pool.length+" q)",false,true);
    };
  }
}
render();
</script>
