<title>Sprint Cloud Practitioner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#f4f6f8; --sheet:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9e0e7;
  --accent:#2747c9; --accent-soft:#e6ebfb; --ok:#1d7a4f; --ok-soft:#e3f3ea; --ko:#b4372f; --ko-soft:#f9e6e4;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151c; --sheet:#17202a; --ink:#e5ebf1; --muted:#97a4b2; --line:#2b3744;
  --accent:#8ea4ff; --accent-soft:#1f2a4d; --ok:#5ccf95; --ok-soft:#163327; --ko:#f08a80; --ko-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151c; --sheet:#17202a; --ink:#e5ebf1; --muted:#97a4b2; --line:#2b3744;
  --accent:#8ea4ff; --accent-soft:#1f2a4d; --ok:#5ccf95; --ok-soft:#163327; --ko:#f08a80; --ko-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stats{display:flex;gap:20px}
.stat b{display:block;font:500 1.15rem var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin:16px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{display:inline-block;min-width:1.5em;padding:0 .4em;margin-left:4px;border-radius:9px;background:var(--ko-soft);color:var(--ko);font:500 .72rem/1.5 var(--f-mono)}

.intro{color:var(--muted);max-width:65ch;margin:0 0 20px}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:24px}
.rules div{background:var(--sheet);padding:10px 12px}
.rules b{display:block;font:500 1rem var(--f-mono)}
.rules span{font-size:.78rem;color:var(--muted)}

.days{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.day{background:var(--sheet);border:1px solid var(--line);border-radius:8px;display:grid;grid-template-columns:64px 1fr}
.day .tag{border-right:1px dashed var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 4px;gap:2px}
.day .tag b{font:700 1.5rem var(--f-display)}
.day .tag span{font:500 .65rem var(--f-mono);color:var(--muted);text-transform:uppercase}
.day .body{padding:14px 16px;min-width:0;display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 .7rem var(--f-mono);padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.cols h3{font:600 .72rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.cols ul{margin:0;padding-left:1.1em}
.cols li{margin:2px 0}
.dayfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex:1;min-width:120px;max-width:260px}
.bar i{display:block;height:100%;background:var(--accent)}
.prog{display:flex;gap:10px;align-items:center;font-size:.82rem;color:var(--muted);flex:1}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--sheet);padding:8px 14px;border-radius:6px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sec{background:transparent;color:var(--muted);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:.85rem;color:var(--muted);margin-top:24px;max-width:65ch}

/* Modules grid */
.modules{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.mod{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center;cursor:pointer;transition:border-color .15s}
.mod:hover{border-color:var(--accent)}
.mod b{display:block;font:700 1rem var(--f-display)}
.mod span{font-size:.7rem;color:var(--muted)}
.mod.done{background:var(--ok-soft);border-color:var(--ok)}
.mod.done span{color:var(--ok)}
.mod.partial{background:var(--accent-soft);border-color:var(--accent)}

/* Free training panel */
.free-panel{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:14px;margin-bottom:24px}
.free-panel h2{font-size:1.1rem}
.free-opts{display:grid;gap:10px}
.free-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.free-row label{font-size:.88rem;color:var(--muted);font-weight:600;min-width:160px}
.free-row input[type=number]{width:80px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--sheet);color:var(--ink)}
.free-row select{padding:6px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:var(--sheet);color:var(--ink)}
.preset-btns{display:flex;flex-wrap:wrap;gap:6px}
.preset-btns button{font:500 .78rem var(--f-mono);padding:4px 10px;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--muted)}
.preset-btns button:hover{border-color:var(--accent);color:var(--accent)}
.tally{font:500 .82rem var(--f-mono);color:var(--muted)}

/* Quiz */
.qhead{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-bottom:10px}
.qcard{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:20px}
.qtext{font-size:1.05rem;font-weight:500;margin:6px 0 4px;max-width:65ch}
.multi{font-size:.82rem;color:var(--accent);font-weight:600}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;text-align:left;background:var(--sheet);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:500 .75rem var(--f-mono);color:var(--muted)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.opt.sq .bub{border-radius:5px}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .bub{background:var(--ko);border-color:var(--ko);color:var(--sheet)}
.why{grid-column:2;font-size:.86rem;color:var(--muted);margin-top:4px}
.opt.good .why,.opt.bad .why{color:var(--ink)}
.verdict{margin-top:14px;font-weight:600}
.verdict.ok{color:var(--ok)} .verdict.ko{color:var(--ko)}
.qnav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:16px}
.timer{font:500 .9rem var(--f-mono)}
.result{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:24px;display:grid;gap:14px}
.score{font:700 3rem var(--f-display);line-height:1}
.missed{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.missed li{border-left:3px solid var(--ko);padding:4px 10px;font-size:.88rem}
.empty{background:var(--sheet);border:1px dashed var(--line);border-radius:8px;padding:24px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}

/* Module dots */
.moddots{display:flex;gap:4px;align-items:center}
.moddot{width:10px;height:10px;border-radius:50%;background:var(--line);border:1px solid var(--line)}
.moddot.done{background:var(--ok);border-color:var(--ok)}
.moddot.partial{background:var(--accent);border-color:var(--accent)}
.moddot.active{border:2px solid var(--accent);background:transparent}

@media (max-width:560px){
  .cols{grid-template-columns:1fr}
  .day{grid-template-columns:1fr}
  .day .tag{flex-direction:row;justify-content:flex-start;gap:10px;border-right:0;border-bottom:1px dashed var(--line);padding:10px 16px}
  .modules{grid-template-columns:repeat(5,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">AWS Certified Cloud Practitioner · CLF-C02</div>
      <h1>Sprint Cloud Practitioner</h1>
    </div>
    <div class="stats">
      <div class="stat"><b id="sDone" class="num">0/350</b><span>questions faites</span></div>
      <div class="stat"><b id="sRate" class="num">–</b><span>bonnes réponses</span></div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabPlan" aria-selected="true">Plan 7 jours</button>
    <button role="tab" id="tabQuiz" aria-selected="false">Entraînement</button>
    <button role="tab" id="tabFree" aria-selected="false">Session libre</button>
    <button role="tab" id="tabErr" aria-selected="false">Mes erreurs<span id="errBadge" class="badge" hidden></span></button>
  </nav>
  <main id="view"></main>
</div>

<script>
/*DATA*/
window.QDATA={};
window.QDATA = window.QDATA || {};
window.QDATA[1] = [
{t:"Infrastructure",q:"Une entreprise veut que son application reste disponible si un datacenter entier tombe en panne. Quelle conception AWS répond à ce besoin au moindre effort ?",o:["Déployer l'application dans plusieurs zones de disponibilité d'une même région","Déployer l'application sur une seule instance EC2 de grande taille","Déployer l'application dans plusieurs edge locations","Déployer l'application dans une Local Zone"],a:[0],e:["Les AZ ne partagent aucun point de défaillance unique : répartir sur plusieurs AZ assure la haute disponibilité.","Une seule instance, même grosse, reste un point de défaillance unique.","Les edge locations servent au cache (CloudFront) et au DNS, pas à héberger une application complète.","Une Local Zone rapproche l'infra d'une ville mais reste un emplacement unique."]},
{t:"Infrastructure",q:"Quelle affirmation décrit correctement une zone de disponibilité (AZ) ?",o:["Un ou plusieurs datacenters avec alimentation, réseau et refroidissement redondants","Une zone géographique contenant plusieurs régions","Un point de présence utilisé par CloudFront pour mettre en cache du contenu","Un serveur AWS installé dans le datacenter du client"],a:[0],e:["C'est la définition officielle d'une AZ.","C'est l'inverse : une région contient plusieurs AZ.","Ça décrit une edge location.","Ça décrit AWS Outposts."]},
{t:"Infrastructure",q:"Une loi impose qu'une entreprise conserve les données de ses clients dans son pays. Quel facteur guide en priorité le choix de la région AWS ?",o:["La conformité et la souveraineté des données","Le prix des instances EC2","Le nombre de services disponibles","La proximité des edge locations"],a:[0],e:["Une exigence légale passe avant tout autre critère de choix de région.","Le prix compte, mais pas devant une obligation légale.","Utile, mais secondaire face à une contrainte légale.","Les edge locations n'ont pas de lien avec la résidence des données."]},
{t:"Infrastructure",q:"Quels sont DEUX avantages d'utiliser plusieurs régions AWS ? (2 réponses)",o:["Reprise après sinistre en cas de panne régionale","Réduction de la latence pour des utilisateurs répartis dans le monde","Suppression totale des frais de transfert de données","Gestion automatique des correctifs de l'OS des instances","Accès gratuit au plan de support Enterprise"],a:[0,1],e:["Une seconde région permet de redémarrer si toute une région est indisponible.","Placer l'application près des utilisateurs réduit la latence.","Le transfert entre régions est au contraire payant.","Les correctifs de l'OS EC2 restent à la charge du client, quelle que soit la région.","Le plan de support n'a aucun lien avec le nombre de régions."]},
{t:"Infrastructure",q:"Quel service s'appuie sur les edge locations pour réduire la latence de diffusion de contenu web ?",o:["Amazon CloudFront","Amazon EBS","AWS Direct Connect","Amazon RDS"],a:[0],e:["CloudFront est le CDN d'AWS, il met en cache le contenu dans les edge locations.","EBS est du stockage en bloc lié à une AZ.","Direct Connect est une liaison privée vers un datacenter client.","RDS est une base relationnelle régionale."]},
{t:"Infrastructure",q:"Une entreprise a besoin de faire tourner des services AWS dans son propre datacenter pour des raisons de latence locale. Quel service choisir ?",o:["AWS Outposts","AWS Local Zones","AWS Wavelength","Amazon CloudFront"],a:[0],e:["Outposts installe du matériel AWS directement chez le client.","Une Local Zone est gérée par AWS près d'une grande ville, pas chez le client.","Wavelength place l'infra dans les réseaux 5G des opérateurs.","CloudFront est un CDN, pas une infrastructure sur site."]},
{t:"Infrastructure",q:"Une application de jeu mobile doit offrir une latence ultra-faible aux utilisateurs connectés en 5G. Quel service est conçu pour ce cas ?",o:["AWS Wavelength","AWS Outposts","AWS Direct Connect","Amazon Lightsail"],a:[0],e:["Wavelength intègre le calcul AWS dans les réseaux 5G des opérateurs.","Outposts est installé dans le datacenter du client, pas chez l'opérateur 5G.","Direct Connect relie un datacenter à AWS, pas des mobiles.","Lightsail est un serveur simple à prix fixe, sans lien avec la 5G."]},
{t:"Infrastructure",q:"Lequel de ces services est global (non lié à une région) ?",o:["AWS IAM","Amazon EC2","Amazon RDS","Amazon EBS"],a:[0],e:["IAM est global : un user ou une policy vaut pour toutes les régions.","EC2 est régional (et l'instance est liée à une AZ).","RDS est régional.","EBS est lié à une AZ."]},
{t:"Infrastructure",q:"Une entreprise veut des temps de réponse de quelques millisecondes pour des utilisateurs situés dans une grande ville éloignée de toute région AWS. Quelle option convient ?",o:["AWS Local Zones","Une zone de disponibilité supplémentaire","AWS Snowball","AWS Global Accelerator uniquement"],a:[0],e:["Les Local Zones étendent une région au plus près d'une grande ville.","Le client ne crée pas d'AZ : elles sont fixées par AWS dans chaque région.","Snowball sert au transfert physique de données.","Global Accelerator optimise le chemin réseau, mais le calcul reste dans la région éloignée."]},
{t:"Infrastructure",q:"Combien de zones de disponibilité une nouvelle région AWS comporte-t-elle au minimum ?",o:["3","1","2","6"],a:[0],e:["AWS conçoit ses nouvelles régions avec au moins 3 AZ.","Une seule AZ ne permettrait pas la haute disponibilité.","AWS vise au moins 3 AZ par région.","Certaines régions en ont plus, mais le minimum est 3."]},
{t:"EC2",q:"Une entreprise exécute une base de données en mémoire qui nécessite beaucoup de RAM. Quelle famille d'instances EC2 choisir ?",o:["Optimisée pour la mémoire (R, X)","Optimisée pour le calcul (C)","Optimisée pour le stockage (I, D)","Calcul accéléré (P, G)"],a:[0],e:["Les familles R et X offrent un ratio mémoire/CPU élevé.","La famille C maximise le CPU, pas la RAM.","Les familles I et D maximisent les E/S disque locales.","Les familles P et G apportent des GPU."]},
{t:"EC2",q:"Quelle famille d'instances convient le mieux à l'encodage vidéo et aux serveurs de jeu, très gourmands en CPU ?",o:["Optimisée pour le calcul","Usage général","Optimisée pour la mémoire","Optimisée pour le stockage"],a:[0],e:["Les instances C sont faites pour les charges limitées par le CPU.","Usage général est équilibré, pas maximisé en CPU.","La mémoire n'est pas le facteur limitant ici.","Le stockage n'est pas le facteur limitant ici."]},
{t:"EC2",q:"Une équipe entraîne des modèles de deep learning. Quelle famille d'instances est la plus adaptée ?",o:["Calcul accéléré (GPU)","Usage général","Optimisée pour le stockage","Instances T avec crédits CPU"],a:[0],e:["L'entraînement de modèles exploite les GPU ou les puces dédiées (P, Trn).","Les instances générales n'ont pas de GPU.","Le stockage local n'est pas le besoin principal.","Les instances T sont faites pour des charges légères avec pics ponctuels."]},
{t:"EC2",q:"Un entrepôt de données traite de gros volumes en lecture/écriture séquentielle sur disque local. Quelle famille choisir ?",o:["Optimisée pour le stockage","Optimisée pour le calcul","Calcul accéléré","Usage général"],a:[0],e:["Les familles I et D offrent de fortes performances d'E/S sur disque local.","Le CPU n'est pas le goulot d'étranglement.","Les GPU ne servent pas ici.","Pas optimisée pour les E/S intensives."]},
{t:"EC2",q:"Qu'est-ce qu'une AMI (Amazon Machine Image) ?",o:["Un modèle contenant l'OS et les logiciels pour lancer une instance","Un type de volume de stockage EBS","Une règle de pare-feu attachée à une instance","Un plan de tarification EC2"],a:[0],e:["L'AMI est l'image de départ d'une instance.","Les volumes EBS sont des disques, pas des images.","Ça décrit un security group.","Les plans tarifaires sont On-Demand, Reserved, Spot, etc."]},
{t:"EC2",q:"Quel service permet de lancer un serveur privé virtuel simple, avec un prix mensuel fixe et prévisible, pour un petit site WordPress ?",o:["Amazon Lightsail","Amazon EC2 Dedicated Hosts","AWS Batch","Amazon EKS"],a:[0],e:["Lightsail cible les besoins simples avec un forfait mensuel.","Les hôtes dédiés sont coûteux et visent la conformité ou les licences.","Batch exécute des traitements par lots.","EKS orchestre des conteneurs Kubernetes, bien trop complexe ici."]},
{t:"Lambda",q:"Une fonction doit redimensionner une image chaque fois qu'un fichier est déposé dans un bucket S3, sans gérer de serveur. Quel service choisir ?",o:["AWS Lambda","Amazon EC2","Amazon Lightsail","AWS Outposts"],a:[0],e:["Lambda exécute du code en réponse à un événement S3, sans serveur.","EC2 demande de gérer des instances en permanence.","Lightsail est un serveur virtuel à gérer.","Outposts est du matériel sur site."]},
{t:"Lambda",q:"Quelle est la durée d'exécution maximale d'une fonction AWS Lambda ?",o:["15 minutes","5 minutes","1 heure","Illimitée"],a:[0],e:["Une exécution Lambda est plafonnée à 15 minutes.","La limite a été portée à 15 minutes.","Au-delà de 15 minutes, il faut EC2, ECS ou Batch.","Lambda est conçu pour des traitements courts."]},
{t:"Lambda",q:"Comment AWS Lambda est-il facturé ?",o:["Au nombre de requêtes et à la durée d'exécution","À l'heure, que la fonction tourne ou non","Au nombre d'instances EC2 provisionnées","Par un forfait mensuel fixe"],a:[0],e:["On paie les invocations et le temps de calcul, à la milliseconde.","Pas de coût quand la fonction ne s'exécute pas.","Lambda ne provisionne pas d'instances visibles par le client.","Le forfait fixe, c'est Lightsail."]},
{t:"Lambda",q:"Un traitement de données dure environ 3 heures et tourne une fois par nuit. Quelle option NE convient PAS ?",o:["AWS Lambda","Amazon EC2","AWS Batch","AWS Fargate"],a:[0],e:["Lambda est limité à 15 minutes par exécution : impossible pour 3 heures d'un seul tenant.","EC2 peut tourner aussi longtemps que nécessaire.","Batch est fait pour les traitements par lots longs.","Fargate exécute des conteneurs sans limite de 15 minutes."]},
{t:"Compute",q:"Un développeur veut déployer une application web en déposant simplement son code, sans configurer EC2, load balancer ni Auto Scaling. Quel service utiliser ?",o:["AWS Elastic Beanstalk","AWS CloudFormation","Amazon EC2","AWS Direct Connect"],a:[0],e:["Beanstalk (PaaS) crée et gère l'infrastructure à partir du code.","CloudFormation demande de décrire soi-même l'infrastructure.","EC2 implique de tout configurer à la main.","Direct Connect est une liaison réseau."]},
{t:"Compute",q:"Avec Elastic Beanstalk, qui reste responsable du code de l'application ?",o:["Le client","AWS","Un partenaire AWS obligatoirement","Le support AWS Enterprise"],a:[0],e:["Beanstalk gère l'infra, le code reste au client.","AWS gère la plateforme, pas le code applicatif.","Aucun partenaire n'est requis.","Le support aide mais ne prend pas en charge le code."]},
{t:"Compute",q:"Une équipe scientifique doit lancer des milliers de simulations en parallèle, avec un provisionnement automatique des ressources. Quel service est conçu pour cela ?",o:["AWS Batch","Amazon Lightsail","AWS Elastic Beanstalk","Amazon CloudFront"],a:[0],e:["Batch planifie et exécute des traitements par lots à grande échelle.","Lightsail vise des serveurs simples.","Beanstalk déploie des applications web.","CloudFront est un CDN."]},
{t:"Compute",q:"Dans quel modèle de service se situe Amazon EC2 ?",o:["IaaS (Infrastructure as a Service)","PaaS (Platform as a Service)","SaaS (Software as a Service)","FaaS uniquement"],a:[0],e:["EC2 fournit des machines virtuelles dont le client gère l'OS.","Le PaaS, c'est par exemple Elastic Beanstalk.","Le SaaS est un logiciel fini prêt à l'emploi.","Le FaaS (fonctions) correspond à Lambda."]},
{t:"Auto Scaling",q:"Quel avantage du cloud Amazon EC2 Auto Scaling apporte-t-il directement ?",o:["L'élasticité","La conformité réglementaire","Le chiffrement des données","La réduction de la latence DNS"],a:[0],e:["Auto Scaling ajoute ou retire des instances selon la demande : c'est l'élasticité.","La conformité relève d'autres services.","Le chiffrement relève de KMS, ACM, etc.","Le DNS relève de Route 53."]},
{t:"Auto Scaling",q:"Une boutique en ligne connaît des pics de trafic imprévisibles. Comment éviter de payer des serveurs inutilisés en période calme ?",o:["Utiliser Auto Scaling pour ajuster le nombre d'instances à la demande","Provisionner des instances pour le pic maximum en permanence","Acheter des hôtes dédiés","Utiliser une seule très grande instance"],a:[0],e:["Auto Scaling réduit la capacité quand la charge baisse.","Dimensionner pour le pic gaspille de l'argent le reste du temps.","Les hôtes dédiés coûtent plus cher et ne s'adaptent pas.","Une grande instance coûte autant en période calme et reste un point de défaillance."]},
{t:"Auto Scaling",q:"Dans un groupe Auto Scaling, que se passe-t-il quand une instance échoue au contrôle de santé ?",o:["Elle est remplacée automatiquement","Le groupe est supprimé","AWS facture une pénalité","Le trafic est redirigé vers une autre région"],a:[0],e:["Auto Scaling remplace les instances défaillantes pour maintenir la capacité.","Le groupe continue de fonctionner.","Aucune pénalité n'existe.","Auto Scaling agit dans la région du groupe."]},
{t:"Auto Scaling",q:"Quels paramètres définissent la taille d'un groupe Auto Scaling ? (2 réponses)",o:["Capacité minimale et maximale","Capacité souhaitée","Nombre d'edge locations","Classe de stockage S3","Plan de support AWS"],a:[0,1],e:["Le minimum et le maximum bornent le nombre d'instances.","La capacité souhaitée est le nombre visé à un instant donné.","Les edge locations ne sont pas liées à Auto Scaling.","Les classes S3 n'ont aucun rapport.","Le plan de support n'a aucun rapport."]},
{t:"ELB",q:"Quel est le rôle principal d'Elastic Load Balancing ?",o:["Répartir le trafic entrant entre plusieurs cibles saines","Stocker les sessions utilisateurs","Chiffrer les volumes EBS","Ajouter des instances quand la charge augmente"],a:[0],e:["Le load balancer distribue les requêtes et écarte les cibles en échec.","Les sessions se stockent par exemple dans ElastiCache ou DynamoDB.","Le chiffrement EBS se fait avec KMS.","Ajouter des instances, c'est le rôle d'Auto Scaling."]},
{t:"ELB",q:"Une application web doit router les requêtes /api vers un groupe de serveurs et /images vers un autre. Quel load balancer choisir ?",o:["Application Load Balancer","Network Load Balancer","Gateway Load Balancer","Classic Load Balancer avec IP fixe"],a:[0],e:["L'ALB (couche 7) sait router selon le chemin d'URL.","Le NLB (couche 4) ne lit pas les URL HTTP.","Le GWLB sert à insérer des appliances réseau tierces.","Le routage par chemin est une fonction de l'ALB."]},
{t:"ELB",q:"Une application TCP doit traiter des millions de requêtes par seconde avec une latence très faible. Quel load balancer convient ?",o:["Network Load Balancer","Application Load Balancer","Gateway Load Balancer","Amazon Route 53"],a:[0],e:["Le NLB (couche 4) est conçu pour les performances extrêmes en TCP/UDP.","L'ALB est fait pour HTTP/HTTPS.","Le GWLB fait passer le trafic par des appliances tierces.","Route 53 est un DNS, pas un load balancer."]},
{t:"ELB",q:"Une entreprise veut faire passer tout son trafic par un pare-feu virtuel d'un éditeur tiers. Quel type de load balancer est prévu pour cela ?",o:["Gateway Load Balancer","Application Load Balancer","Network Load Balancer","AWS WAF"],a:[0],e:["Le GWLB déploie et répartit le trafic vers des appliances tierces.","L'ALB route du trafic web vers des applis.","Le NLB ne gère pas l'insertion d'appliances.","WAF est un pare-feu AWS, pas un load balancer."]},
{t:"ELB",q:"Quelle combinaison offre à la fois haute disponibilité et élasticité pour une application web sur EC2 ?",o:["Elastic Load Balancing + Auto Scaling sur plusieurs AZ","Une instance EC2 + un volume EBS","CloudFront + une seule instance","Route 53 + une seule AZ"],a:[0],e:["Le load balancer répartit et Auto Scaling ajuste le nombre d'instances dans plusieurs AZ.","Une seule instance reste un point de défaillance unique.","CloudFront met en cache mais l'origine reste unique.","Une seule AZ n'est pas hautement disponible."]},
{t:"Conteneurs",q:"Où une entreprise doit-elle stocker ses images Docker pour les utiliser avec Amazon ECS ?",o:["Amazon ECR","Amazon EFS","AWS CodePipeline","Amazon S3 Glacier"],a:[0],e:["ECR est le registre d'images de conteneurs d'AWS.","EFS est un système de fichiers partagé.","CodePipeline orchestre la CI/CD.","Glacier est fait pour l'archivage."]},
{t:"Conteneurs",q:"Une entreprise utilise déjà Kubernetes sur site et veut le même outil dans AWS, en managé. Quel service choisir ?",o:["Amazon EKS","Amazon ECS","AWS Elastic Beanstalk","AWS Lambda"],a:[0],e:["EKS est le Kubernetes managé d'AWS.","ECS est l'orchestrateur propre à AWS, pas Kubernetes.","Beanstalk n'est pas Kubernetes.","Lambda n'exécute pas Kubernetes."]},
{t:"Conteneurs",q:"Une équipe veut exécuter des conteneurs sans gérer ni mettre à jour les instances EC2 sous-jacentes. Quel service utiliser ?",o:["AWS Fargate","Amazon EC2 Auto Scaling","Amazon Lightsail","AWS Outposts"],a:[0],e:["Fargate exécute les conteneurs d'ECS ou EKS sans serveurs à gérer.","Auto Scaling gère le nombre d'instances, que le client doit toujours administrer.","Lightsail est un serveur virtuel à gérer.","Outposts est du matériel sur site."]},
{t:"Conteneurs",q:"Quel service orchestre des conteneurs Docker de manière simple et très intégrée à AWS, sans Kubernetes ?",o:["Amazon ECS","Amazon EKS","Amazon ECR","AWS Batch"],a:[0],e:["ECS est l'orchestrateur maison d'AWS.","EKS repose sur Kubernetes.","ECR stocke les images, il n'orchestre pas.","Batch gère des traitements par lots."]},
{t:"Conteneurs",q:"Quelle affirmation sur AWS Fargate est correcte ?",o:["C'est un moteur de calcul sans serveur pour ECS et EKS","C'est un registre d'images Docker","C'est un service de base de données","C'est un CDN"],a:[0],e:["Fargate exécute les conteneurs sans que le client gère les serveurs.","Le registre, c'est ECR.","Fargate ne stocke pas de données.","Le CDN, c'est CloudFront."]},
{t:"Conteneurs",q:"Une entreprise gère elle-même Docker sur des instances EC2 et veut se décharger de la gestion des clusters et de leur maintenance. Quelle option réduit le plus l'effort ?",o:["Amazon ECS sur AWS Fargate","Ajouter des instances EC2 plus grosses","Amazon RDS","Amazon Athena"],a:[0],e:["ECS orchestre et Fargate supprime la gestion des serveurs.","De plus grosses instances restent à gérer.","RDS est une base de données relationnelle.","Athena interroge des données dans S3."]},
{t:"Infrastructure",q:"Quels services utilisent les edge locations AWS ? (2 réponses)",o:["Amazon CloudFront","Amazon Route 53","Amazon RDS","Amazon EBS","AWS Batch"],a:[0,1],e:["CloudFront met en cache le contenu dans les edge locations.","Route 53 répond aux requêtes DNS depuis les edge locations.","RDS tourne dans une région et ses AZ.","EBS est lié à une AZ.","Batch tourne dans une région."]},
{t:"Infrastructure",q:"Pourquoi déployer une application sur plusieurs AZ plutôt que sur une seule ?",o:["Pour qu'une panne d'AZ n'arrête pas l'application","Pour réduire la facture de transfert de données","Pour respecter automatiquement le RGPD","Pour éviter de configurer des security groups"],a:[0],e:["Les AZ sont isolées : si l'une tombe, les autres continuent.","Le trafic entre AZ est en réalité légèrement payant.","La conformité RGPD dépend de bien d'autres éléments.","Les security groups restent nécessaires."]},
{t:"Infrastructure",q:"Quel avantage de l'infrastructure mondiale AWS permet de lancer une application dans un nouveau pays en quelques minutes ?",o:["Le déploiement mondial rapide grâce aux régions existantes","Les remises sur volume","Le modèle de responsabilité partagée","AWS Artifact"],a:[0],e:["Les régions existent déjà : on y déploie en quelques clics, sans construire de datacenter.","Les remises sur volume concernent le prix, pas la vitesse de déploiement.","La responsabilité partagée concerne la sécurité.","Artifact fournit des rapports de conformité."]},
{t:"EC2",q:"Quelle option permet d'exécuter automatiquement un script de configuration au premier démarrage d'une instance EC2 ?",o:["Les user data","Un security group","Une Elastic IP","AWS Artifact"],a:[0],e:["Les user data contiennent un script exécuté au lancement.","Un security group filtre le trafic réseau.","Une Elastic IP est une adresse IP publique fixe.","Artifact fournit des rapports de conformité."]},
{t:"EC2",q:"Un serveur web a une charge modérée avec des pics occasionnels de CPU. Quelle famille d'instances est la plus économique ?",o:["Instances T à performances évolutives","Instances C optimisées pour le calcul","Instances P à GPU","Instances X optimisées pour la mémoire"],a:[0],e:["Les instances T accumulent des crédits CPU pour absorber les pics, à petit prix.","La famille C est surdimensionnée pour une charge modérée.","Les GPU ne servent à rien ici.","La famille X vise des besoins mémoire très élevés."]},
{t:"Compute",q:"Un client veut une solution où il ne gère ni serveur, ni OS, ni mise à l'échelle, et paie uniquement à l'exécution. Quels services correspondent ? (2 réponses)",o:["AWS Lambda","AWS Fargate","Amazon EC2","Amazon Lightsail","AWS Outposts"],a:[0,1],e:["Lambda est entièrement sans serveur.","Fargate exécute des conteneurs sans serveur à gérer.","Avec EC2, le client gère l'OS et la capacité.","Lightsail reste un serveur virtuel à administrer.","Outposts est du matériel installé chez le client."]},
{t:"ELB",q:"Un load balancer détecte qu'une instance ne répond plus. Que fait-il ?",o:["Il cesse de lui envoyer du trafic","Il redémarre l'instance","Il en crée une copie dans une autre région","Il ouvre un ticket au support AWS"],a:[0],e:["Grâce aux contrôles de santé, il n'envoie plus de requêtes à une cible malsaine.","Le load balancer ne redémarre pas les instances (Auto Scaling peut la remplacer).","Il ne copie pas d'instances.","Aucun ticket n'est ouvert automatiquement."]},
{t:"Auto Scaling",q:"Quel est le lien entre Auto Scaling et Elastic Load Balancing ?",o:["Auto Scaling ajuste le nombre d'instances, le load balancer répartit le trafic entre elles","Ce sont deux noms du même service","Auto Scaling remplace le load balancer","Le load balancer décide de la taille des instances"],a:[0],e:["Les deux se complètent : combien d'instances, et à laquelle envoyer chaque requête.","Ce sont deux services distincts.","Ils ne se remplacent pas.","La taille des instances est fixée dans le modèle de lancement."]},
{t:"Infrastructure",q:"Une entreprise veut tester une nouvelle application auprès d'utilisateurs en Asie sans investir dans du matériel. Quel avantage du cloud cela illustre-t-il ?",o:["Devenir mondial en quelques minutes","Remplacer les dépenses variables par des dépenses fixes","Augmenter les coûts de datacenter","Deviner la capacité à l'avance"],a:[0],e:["On déploie dans une région asiatique sans rien acheter.","C'est l'inverse : le cloud remplace les dépenses fixes par des dépenses variables.","Le cloud réduit au contraire les coûts de datacenter.","Le cloud permet justement d'arrêter de deviner la capacité."]},
{t:"Conteneurs",q:"Quelle affirmation compare correctement ECS et EKS ?",o:["Les deux orchestrent des conteneurs, EKS utilise Kubernetes","ECS stocke des images, EKS les exécute","EKS est sans serveur, ECS ne l'est jamais","ECS est réservé à Windows"],a:[0],e:["Ce sont deux orchestrateurs : EKS est basé sur Kubernetes, ECS est propre à AWS.","Le stockage des images, c'est ECR.","Les deux peuvent tourner sur EC2 ou sur Fargate.","ECS gère Linux et Windows."]},
{t:"Compute",q:"Quel service choisir pour exécuter du code en réponse à une requête API, avec une facturation à la milliseconde et aucune instance à gérer ?",o:["AWS Lambda derrière Amazon API Gateway","Amazon EC2 derrière un Network Load Balancer","Amazon Lightsail","AWS Batch"],a:[0],e:["API Gateway reçoit la requête et déclenche Lambda, sans serveur.","EC2 demande de gérer des instances.","Lightsail est un serveur à gérer.","Batch vise les traitements par lots, pas les API temps réel."]}

{t:"S3",q:"Quel type de stockage est Amazon S3 ?",o:["Stockage objet","Stockage en bloc","Système de fichiers partagé NFS","Base de données relationnelle"],a:[0],e:["S3 stocke des objets (fichier + métadonnées) dans des buckets.","Le stockage en bloc, c'est EBS.","Le NFS partagé, c'est EFS.","Les bases relationnelles, c'est RDS ou Aurora."]},
{t:"S3",q:"Quelle durabilité Amazon S3 Standard est-il conçu pour offrir ?",o:["99,999999999 % (11 neuf)","99,9 %","99,99 %","100 %"],a:[0],e:["S3 est conçu pour 11 neuf de durabilité.","99,9 % correspond à un ordre de grandeur de disponibilité, pas de durabilité.","99,99 % est la disponibilité visée de S3 Standard, pas sa durabilité.","Aucun service ne garantit 100 %."]},
{t:"S3",q:"Une entreprise ne connaît pas à l'avance la fréquence d'accès à ses données, et elle change souvent. Quelle classe S3 optimise automatiquement les coûts ?",o:["S3 Intelligent-Tiering","S3 Standard-IA","S3 One Zone-IA","S3 Glacier Deep Archive"],a:[0],e:["Intelligent-Tiering déplace les objets entre niveaux selon leur usage réel.","Standard-IA suppose un accès peu fréquent connu, avec des frais de récupération.","One Zone-IA stocke dans une seule AZ et suppose un accès rare.","Deep Archive est pour l'archivage, avec des heures de délai."]},
{t:"S3",q:"Des documents doivent être conservés 10 ans pour raisons légales et ne seront presque jamais consultés. Quelle classe est la moins chère ?",o:["S3 Glacier Deep Archive","S3 Standard","S3 Intelligent-Tiering","S3 Standard-IA"],a:[0],e:["Deep Archive est la classe la moins chère, adaptée aux archives long terme.","Standard est la plus chère au stockage.","Intelligent-Tiering est utile pour un accès imprévisible, pas pour de l'archive pure.","Standard-IA coûte nettement plus que Deep Archive."]},
{t:"S3",q:"Des données peu consultées doivent pouvoir être récupérées en millisecondes. Elles sont faciles à recréer si elles sont perdues. Quelle classe est la plus économique ?",o:["S3 One Zone-IA","S3 Standard","S3 Glacier Flexible Retrieval","S3 Glacier Deep Archive"],a:[0],e:["One Zone-IA est moins chère car stockée dans une seule AZ, acceptable pour des données recréables.","Standard est plus cher pour des données peu consultées.","Glacier Flexible Retrieval demande des minutes à des heures.","Deep Archive demande jusqu'à 12 heures."]},
{t:"S3",q:"Des archives médicales sont consultées environ une fois par trimestre, mais doivent alors être disponibles immédiatement. Quelle classe choisir ?",o:["S3 Glacier Instant Retrieval","S3 Glacier Deep Archive","S3 Glacier Flexible Retrieval","S3 Standard"],a:[0],e:["Instant Retrieval offre un accès en millisecondes à un prix d'archive.","Deep Archive demande jusqu'à 12 heures.","Flexible Retrieval demande des minutes à des heures.","Standard coûte plus cher pour des données si rarement lues."]},
{t:"S3",q:"Quelle fonctionnalité S3 déplace automatiquement les objets vers une classe moins chère après 30 jours, puis les supprime après 5 ans ?",o:["Les règles de cycle de vie (lifecycle)","Le versioning","La réplication entre régions","S3 Transfer Acceleration"],a:[0],e:["Les règles de cycle de vie automatisent transitions et expirations.","Le versioning garde les versions précédentes.","La réplication copie les objets vers un autre bucket.","Transfer Acceleration accélère les envois."]},
{t:"S3",q:"Un utilisateur supprime par erreur un fichier important dans S3. Quelle fonctionnalité aurait permis de le récupérer ?",o:["Le versioning S3","S3 Transfer Acceleration","Les règles de cycle de vie","S3 One Zone-IA"],a:[0],e:["Avec le versioning, une suppression ajoute un marqueur et l'ancienne version reste récupérable.","Transfer Acceleration ne protège pas les données.","Le cycle de vie pourrait même supprimer des objets.","Une classe de stockage ne protège pas contre la suppression."]},
{t:"S3",q:"Quel service S3 permet d'héberger un site web statique (HTML, CSS, images) sans serveur ?",o:["L'hébergement de site web statique S3","Amazon EBS","Amazon EC2 avec Apache","AWS Storage Gateway"],a:[0],e:["S3 peut servir directement des sites statiques.","EBS est un disque attaché à une instance.","Possible, mais demande de gérer un serveur.","Storage Gateway relie un site client à AWS."]},
{t:"S3",q:"Quelle affirmation sur les noms de bucket S3 est vraie ?",o:["Ils doivent être uniques dans le monde entier","Ils doivent être uniques uniquement dans la région","Ils peuvent être identiques entre deux comptes","Ils sont attribués automatiquement par AWS"],a:[0],e:["Un nom de bucket est unique sur l'ensemble d'AWS (dans la même partition).","Le bucket est régional, mais son nom est mondial.","Deux comptes ne peuvent pas avoir le même nom de bucket.","C'est le client qui choisit le nom."]},
{t:"S3",q:"Des utilisateurs du monde entier envoient de gros fichiers vers un bucket S3 situé en Europe et les transferts sont lents. Quelle fonctionnalité aide ?",o:["S3 Transfer Acceleration","S3 One Zone-IA","Le versioning S3","Les politiques de cycle de vie"],a:[0],e:["Transfer Acceleration fait entrer les données par l'edge location la plus proche.","Une classe de stockage ne change pas la vitesse d'envoi.","Le versioning n'agit pas sur la vitesse.","Le cycle de vie n'agit pas sur la vitesse."]},
{t:"S3",q:"Quelle est la taille maximale d'un objet unique dans Amazon S3 ?",o:["5 To","5 Go","160 To","Illimitée"],a:[0],e:["Un objet S3 peut atteindre 5 To.","5 Go est la limite d'un envoi en une seule requête PUT, pas celle d'un objet.","160 To ne correspond pas à la limite d'un objet.","Le bucket est illimité, mais un objet est limité à 5 To."]},
{t:"S3",q:"Quels éléments influencent le coût de S3 ? (2 réponses)",o:["La quantité de données stockées et la classe de stockage","Le volume de données transférées vers internet","Le nombre de zones de disponibilité de la région","Le nombre d'utilisateurs IAM du compte","Le plan de support choisi"],a:[0,1],e:["On paie au Go stocké, selon la classe.","Le transfert sortant vers internet est payant.","Le nombre d'AZ ne change pas le prix.","IAM est gratuit et sans lien.","Le support est facturé à part."]},
{t:"EBS",q:"Quel service fournit un stockage en bloc persistant pour une instance EC2 ?",o:["Amazon EBS","Amazon S3","Amazon EFS","Le stockage d'instance"],a:[0],e:["EBS est un disque réseau persistant attaché à une instance.","S3 est du stockage objet.","EFS est un système de fichiers partagé.","Le stockage d'instance est en bloc, mais éphémère."]},
{t:"EBS",q:"Que deviennent les données d'un stockage d'instance (instance store) quand l'instance est arrêtée ?",o:["Elles sont perdues","Elles sont copiées dans S3","Elles sont conservées","Elles sont déplacées vers EBS"],a:[0],e:["Le stockage d'instance est éphémère : il disparaît à l'arrêt.","Aucune copie automatique n'a lieu.","C'est EBS qui conserve les données.","Aucun déplacement automatique n'a lieu."]},
{t:"EBS",q:"Comment un volume EBS est-il sauvegardé ?",o:["Par des snapshots stockés dans Amazon S3","Par une copie automatique dans une autre région","Par AWS Artifact","Par réplication dans le stockage d'instance"],a:[0],e:["Les snapshots EBS sont incrémentaux et stockés dans S3.","La copie vers une autre région doit être demandée.","Artifact fournit des rapports de conformité.","Le stockage d'instance est éphémère."]},
{t:"EBS",q:"Une instance EC2 est dans l'AZ eu-west-3a. Où son volume EBS doit-il se trouver ?",o:["Dans la même AZ, eu-west-3a","Dans n'importe quelle AZ de la région","Dans n'importe quelle région","Dans une edge location"],a:[0],e:["Un volume EBS ne s'attache qu'à une instance de la même AZ.","Pour changer d'AZ, il faut passer par un snapshot.","Un volume ne traverse pas les régions directement.","EBS n'existe pas dans les edge locations."]},
{t:"EBS",q:"Comment déplacer les données d'un volume EBS vers une autre AZ ?",o:["Créer un snapshot puis un nouveau volume dans l'AZ cible","Détacher et rattacher le volume dans l'autre AZ","Activer S3 Transfer Acceleration","Utiliser AWS Direct Connect"],a:[0],e:["Le snapshot permet de recréer le volume ailleurs.","Un volume EBS ne s'attache que dans son AZ.","Transfer Acceleration concerne S3.","Direct Connect est une liaison réseau vers un datacenter."]},
{t:"EFS",q:"Des centaines d'instances EC2 Linux doivent accéder en même temps au même système de fichiers. Quel service choisir ?",o:["Amazon EFS","Amazon EBS","Le stockage d'instance","Amazon S3 Glacier"],a:[0],e:["EFS est un système de fichiers NFS partagé entre de nombreuses instances.","EBS s'attache en général à une seule instance.","Le stockage d'instance est local à une machine.","Glacier est fait pour l'archivage."]},
{t:"FSx",q:"Une entreprise a besoin d'un partage de fichiers Windows (SMB) intégré à Active Directory. Quel service choisir ?",o:["Amazon FSx for Windows File Server","Amazon EFS","Amazon S3","Amazon EBS"],a:[0],e:["FSx for Windows offre SMB et l'intégration Active Directory.","EFS utilise NFS et vise Linux.","S3 est du stockage objet.","EBS n'est pas un partage de fichiers."]},
{t:"FSx",q:"Une simulation de calcul haute performance a besoin d'un système de fichiers très rapide. Quel service est conçu pour cela ?",o:["Amazon FSx for Lustre","Amazon S3 Glacier","AWS Storage Gateway","Amazon EFS One Zone"],a:[0],e:["FSx for Lustre vise le calcul haute performance.","Glacier est fait pour l'archivage.","Storage Gateway relie un site client à AWS.","EFS est polyvalent, pas spécialisé HPC."]},
{t:"EFS",q:"Comment Amazon EFS est-il facturé ?",o:["Au stockage réellement utilisé","Au stockage provisionné à l'avance","Au nombre d'instances connectées","Par un forfait annuel"],a:[0],e:["EFS grandit et rétrécit tout seul, on paie ce qu'on utilise.","C'est EBS qui est facturé au Go provisionné.","Le nombre d'instances ne change pas le prix.","Pas de forfait annuel."]},
{t:"Storage Gateway",q:"Une entreprise veut que ses serveurs sur site accèdent à du stockage AWS tout en gardant un cache local des données récentes. Quel service utiliser ?",o:["AWS Storage Gateway","AWS Snowball","Amazon EFS","AWS DataSync"],a:[0],e:["Storage Gateway est une solution hybride avec cache local.","Snowball est un appareil de transfert ponctuel.","EFS est utilisé depuis AWS, sans cache local.","DataSync copie des données, sans cache local permanent."]},
{t:"Storage Gateway",q:"Une entreprise veut remplacer ses bandes magnétiques de sauvegarde par du stockage cloud sans changer son logiciel de sauvegarde. Quelle option choisir ?",o:["Storage Gateway Tape Gateway","Amazon EBS","S3 Transfer Acceleration","Amazon FSx for Lustre"],a:[0],e:["Tape Gateway présente des bandes virtuelles au logiciel existant.","EBS ne s'utilise pas comme bande.","Transfer Acceleration accélère des envois S3.","FSx for Lustre vise le HPC."]},
{t:"Backup",q:"Une entreprise veut gérer de façon centralisée les sauvegardes d'EBS, RDS, DynamoDB et EFS avec des règles communes. Quel service choisir ?",o:["AWS Backup","Amazon S3 Glacier","AWS Elastic Disaster Recovery","AWS Config"],a:[0],e:["AWS Backup centralise et automatise les sauvegardes multi-services.","Glacier est une classe de stockage, pas un orchestrateur de sauvegardes.","DRS réplique des serveurs pour la reprise après sinistre.","Config suit la configuration des ressources."]},
{t:"Backup",q:"Une entreprise veut répliquer en continu ses serveurs sur site vers AWS pour pouvoir redémarrer en quelques minutes après un sinistre. Quel service choisir ?",o:["AWS Elastic Disaster Recovery","AWS Backup","Amazon S3 Glacier Deep Archive","AWS Storage Gateway Tape Gateway"],a:[0],e:["DRS réplique en continu et permet une reprise rapide.","Backup fait des sauvegardes planifiées, pas une réplication continue.","Deep Archive demande des heures pour récupérer.","Tape Gateway remplace des bandes de sauvegarde."]},
{t:"Bases de données",q:"Quel service est une base de données relationnelle managée qui prend en charge MySQL, PostgreSQL, Oracle et SQL Server ?",o:["Amazon RDS","Amazon DynamoDB","Amazon Neptune","Amazon ElastiCache"],a:[0],e:["RDS gère plusieurs moteurs relationnels.","DynamoDB est NoSQL.","Neptune est une base graphe.","ElastiCache est un cache en mémoire."]},
{t:"Bases de données",q:"Quel service relationnel, conçu par AWS et compatible MySQL et PostgreSQL, offre des performances supérieures et 6 copies des données sur 3 AZ ?",o:["Amazon Aurora","Amazon RDS for Oracle","Amazon Redshift","Amazon DocumentDB"],a:[0],e:["Aurora est la base relationnelle haute performance d'AWS.","Oracle n'est pas compatible MySQL/PostgreSQL.","Redshift est un entrepôt de données.","DocumentDB est compatible MongoDB."]},
{t:"Bases de données",q:"Une application mobile a besoin d'une base NoSQL clé-valeur, sans serveur, avec des latences de quelques millisecondes à n'importe quelle échelle. Quel service choisir ?",o:["Amazon DynamoDB","Amazon RDS","Amazon Redshift","Amazon Neptune"],a:[0],e:["DynamoDB est la base NoSQL clé-valeur sans serveur d'AWS.","RDS est relationnel.","Redshift est un entrepôt de données analytique.","Neptune est une base graphe."]},
{t:"Bases de données",q:"Une application veut réduire la charge sur sa base en mettant en cache les requêtes fréquentes, avec des latences de l'ordre de la microseconde. Quel service utiliser ?",o:["Amazon ElastiCache","Amazon S3","Amazon Redshift","AWS Backup"],a:[0],e:["ElastiCache est un cache en mémoire (Redis, Memcached).","S3 n'est pas un cache.","Redshift est fait pour l'analytique.","Backup gère les sauvegardes."]},
{t:"Bases de données",q:"Une application existante utilise MongoDB. Quel service AWS managé est compatible ?",o:["Amazon DocumentDB","Amazon DynamoDB","Amazon Aurora","Amazon Neptune"],a:[0],e:["DocumentDB est compatible MongoDB.","DynamoDB est NoSQL mais n'est pas compatible MongoDB.","Aurora est relationnel.","Neptune est une base graphe."]},
{t:"Bases de données",q:"Un réseau social veut stocker et interroger les relations complexes entre utilisateurs (amis d'amis, recommandations). Quel service choisir ?",o:["Amazon Neptune","Amazon RDS","Amazon ElastiCache","Amazon S3"],a:[0],e:["Neptune est une base graphe, faite pour les relations.","Les jointures relationnelles deviennent lentes sur ce type de requêtes.","ElastiCache est un cache.","S3 est du stockage objet."]},
{t:"Bases de données",q:"Une entreprise veut analyser des pétaoctets de données historiques en SQL pour ses rapports décisionnels. Quel service choisir ?",o:["Amazon Redshift","Amazon RDS","Amazon DynamoDB","Amazon ElastiCache"],a:[0],e:["Redshift est l'entrepôt de données d'AWS, fait pour l'analytique.","RDS est conçu pour les transactions, pas pour l'analytique massive.","DynamoDB est NoSQL transactionnel.","ElastiCache est un cache."]},
{t:"Bases de données",q:"Quel avantage principal apporte une base managée (RDS) par rapport à une base installée sur EC2 ?",o:["AWS gère les correctifs, les sauvegardes et la haute disponibilité","Le client obtient un accès complet à l'OS","La base devient gratuite","Plus besoin de gérer les accès à la base"],a:[0],e:["Les tâches d'administration sont prises en charge par AWS.","C'est l'inverse : sur RDS, pas d'accès à l'OS.","RDS est payant.","Les utilisateurs et droits de la base restent au client."]},
{t:"Bases de données",q:"Une application dépend d'un logiciel qui doit être installé sur le même serveur que la base de données. Quelle option choisir ?",o:["Installer la base sur Amazon EC2","Amazon RDS","Amazon Aurora Serverless","Amazon DynamoDB"],a:[0],e:["Seul EC2 donne l'accès à l'OS nécessaire pour installer un logiciel.","RDS ne donne pas accès à l'OS.","Aurora Serverless ne donne pas accès à l'OS.","DynamoDB est un service sans serveur."]},
{t:"Bases de données",q:"Quelle option RDS assure la haute disponibilité avec une bascule automatique vers une copie de secours dans une autre AZ ?",o:["RDS Multi-AZ","Les réplicas en lecture (Read Replicas)","Les snapshots manuels","ElastiCache"],a:[0],e:["Multi-AZ maintient une copie synchrone et bascule automatiquement.","Les réplicas en lecture servent surtout à améliorer les performances de lecture.","Un snapshot doit être restauré à la main.","ElastiCache est un cache, pas une copie de secours."]},
{t:"Bases de données",q:"Une application fait beaucoup plus de lectures que d'écritures et la base RDS sature. Quelle solution améliore les performances de lecture ?",o:["Ajouter des réplicas en lecture (Read Replicas)","Activer Multi-AZ","Passer en S3 Glacier","Ajouter une NACL"],a:[0],e:["Les Read Replicas répartissent les lectures sur plusieurs copies.","Multi-AZ apporte la disponibilité, pas la performance de lecture.","Glacier sert à l'archivage.","Une NACL filtre le trafic réseau."]},
{t:"Bases de données",q:"Quels services sont des bases de données NoSQL ? (2 réponses)",o:["Amazon DynamoDB","Amazon DocumentDB","Amazon Aurora","Amazon RDS for PostgreSQL","Amazon Redshift"],a:[0,1],e:["DynamoDB est NoSQL clé-valeur.","DocumentDB est NoSQL orienté documents.","Aurora est relationnel.","PostgreSQL est relationnel.","Redshift est un entrepôt de données relationnel."]},
{t:"Bases de données",q:"Dans le modèle de responsabilité partagée, qui applique les correctifs du moteur de base de données sur Amazon RDS ?",o:["AWS","Le client","Un partenaire AWS","Personne, ils ne sont pas nécessaires"],a:[0],e:["Sur RDS, AWS gère l'OS et les correctifs du moteur.","Le client gère les données, les accès et la configuration réseau.","Aucun partenaire n'est requis.","Les correctifs sont nécessaires et appliqués par AWS."]},
{t:"Migration",q:"Une entreprise veut migrer sa base Oracle vers Aurora PostgreSQL. Quels outils utiliser ? (2 réponses)",o:["AWS Schema Conversion Tool (SCT)","AWS Database Migration Service (DMS)","AWS Snowball","Amazon Athena","AWS Artifact"],a:[0,1],e:["SCT convertit le schéma d'un moteur à l'autre.","DMS migre les données en gardant la source opérationnelle.","Snowball transfère physiquement des fichiers.","Athena interroge des données dans S3.","Artifact fournit des rapports de conformité."]},
{t:"Migration",q:"Une entreprise veut migrer une base MySQL vers Amazon RDS for MySQL en limitant l'interruption de service. Quel service choisir ?",o:["AWS DMS","AWS SCT uniquement","AWS Snowball","AWS Backup"],a:[0],e:["DMS migre la base pendant que la source reste en service.","SCT n'est utile que si le moteur change.","Snowball est fait pour de très gros volumes de fichiers.","Backup gère des sauvegardes, pas des migrations."]},
{t:"Migration",q:"Une entreprise doit transférer 500 To vers AWS mais sa connexion internet est lente. Quel service est conçu pour ce cas ?",o:["AWS Snowball","AWS Site-to-Site VPN","Amazon CloudFront","S3 Transfer Acceleration"],a:[0],e:["Snowball est un appareil physique, rempli sur site puis renvoyé à AWS.","Un VPN passe par la même connexion lente.","CloudFront distribue du contenu, il n'importe pas.","Transfer Acceleration reste limité par la connexion du client."]},
{t:"Migration",q:"Quel service recense les serveurs sur site, leur utilisation et leurs dépendances pour planifier une migration ?",o:["AWS Application Discovery Service","AWS Migration Hub","AWS DMS","Migration Evaluator"],a:[0],e:["Application Discovery Service fait l'inventaire et cartographie les dépendances.","Migration Hub suit l'avancement des migrations.","DMS migre des bases.","Migration Evaluator construit le business case (TCO)."]},
{t:"Migration",q:"Quel service suit de façon centralisée l'avancement de toutes les migrations d'une entreprise ?",o:["AWS Migration Hub","AWS Application Migration Service","AWS Snowball","AWS Control Tower"],a:[0],e:["Migration Hub est le tableau de bord central des migrations.","Application Migration Service exécute la migration des serveurs.","Snowball transfère des données physiquement.","Control Tower met en place un environnement multi-comptes."]},
{t:"Migration",q:"Une entreprise veut migrer ses serveurs sur site vers EC2 tels quels (lift & shift) avec une réplication continue. Quel service choisir ?",o:["AWS Application Migration Service","AWS SCT","Amazon Lightsail","AWS Elastic Beanstalk"],a:[0],e:["Application Migration Service (MGN) automatise le rehost vers EC2.","SCT convertit des schémas de bases.","Lightsail ne sert pas à migrer des serveurs.","Beanstalk déploie du code applicatif."]},
{t:"Migration",q:"Avant de migrer, une direction veut une estimation des économies possibles (TCO) pour décider. Quel service aide ?",o:["Migration Evaluator","AWS Migration Hub","AWS Budgets","AWS Cost Explorer"],a:[0],e:["Migration Evaluator construit le business case de migration.","Migration Hub suit des migrations en cours.","Budgets alerte sur des dépenses existantes.","Cost Explorer analyse des dépenses passées sur AWS."]},
{t:"Stockage",q:"Quels services fournissent un système de fichiers partagé ? (2 réponses)",o:["Amazon EFS","Amazon FSx","Amazon EBS","Amazon S3","Le stockage d'instance"],a:[0,1],e:["EFS est un système de fichiers NFS partagé.","FSx propose des systèmes de fichiers spécialisés (Windows, Lustre…).","EBS est du stockage en bloc.","S3 est du stockage objet.","Le stockage d'instance est en bloc et local."]},
{t:"Stockage",q:"Une application a besoin d'un espace temporaire ultra-rapide pour du cache, et la perte de ces données à l'arrêt n'est pas grave. Quelle option est la plus adaptée ?",o:["Le stockage d'instance","Amazon EBS Provisioned IOPS","Amazon EFS","Amazon S3 Standard"],a:[0],e:["Le stockage d'instance est le plus rapide et convient aux données éphémères.","EBS est persistant et plus cher pour ce besoin.","EFS est partagé, pas optimisé pour du cache local.","S3 n'est pas un disque local."]},
{t:"S3",q:"Comment empêcher qu'un bucket S3 soit rendu public par erreur sur tout un compte ?",o:["Activer S3 Block Public Access","Activer le versioning","Utiliser S3 One Zone-IA","Activer Transfer Acceleration"],a:[0],e:["Block Public Access empêche toute exposition publique.","Le versioning protège des suppressions, pas de l'exposition.","Une classe de stockage ne gère pas l'accès.","Transfer Acceleration concerne la vitesse."]},
{t:"Bases de données",q:"Quelle base est la plus adaptée à des transactions de commande en ligne (SQL, jointures, cohérence forte) ?",o:["Amazon Aurora","Amazon Redshift","Amazon Neptune","Amazon S3"],a:[0],e:["Aurora est relationnel transactionnel, idéal pour les commandes.","Redshift est fait pour l'analytique, pas pour les transactions.","Neptune vise les relations en graphe.","S3 n'est pas une base de données."]}
];
