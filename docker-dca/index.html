<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2496ED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Certifs">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<title>Sprint Docker DCA</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%3E%3Ctext%20y=%2228%22%20font-size=%2228%22%3E🐳%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#f4f6f8; --sheet:#ffffff; --ink:#15202b; --muted:#5b6876; --line:#d9e0e7;
  --accent:#2496ED; --accent-soft:#e6f3fd; --ok:#1d7a4f; --ok-soft:#e3f3ea; --ko:#b4372f; --ko-soft:#f9e6e4;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f151c; --sheet:#17202a; --ink:#e5ebf1; --muted:#97a4b2; --line:#2b3744;
  --accent:#5eb8ff; --accent-soft:#0d2a45; --ok:#5ccf95; --ok-soft:#163327; --ko:#f08a80; --ko-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f151c; --sheet:#17202a; --ink:#e5ebf1; --muted:#97a4b2; --line:#2b3744;
  --accent:#5eb8ff; --accent-soft:#0d2a45; --ok:#5ccf95; --ok-soft:#163327; --ko:#f08a80; --ko-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
.wrap{max-width:800px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.25rem;font-weight:700}
.eyebrow{font:500 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.stats{display:flex;gap:20px}
.stat b{display:block;font:500 1.15rem var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin:16px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 14px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs .tab-fiche{margin-left:auto;padding:10px 14px;color:var(--muted);font-weight:600;text-decoration:none;white-space:nowrap}
nav.tabs .tab-fiche:hover{color:var(--ink)}

.day-card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
.day-header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;margin-bottom:14px}
.day-num{font:700 2rem var(--f-mono);color:var(--accent)}
.day-theme{font:700 1.1rem var(--f-display)}
.day-meta{font-size:.8rem;color:var(--muted)}
.progress-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.progress-bar span{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.sections{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.section-tag{font:.8rem var(--f-mono);background:var(--accent-soft);color:var(--accent);padding:3px 10px;border-radius:20px}
.read-list{font-size:.88rem;color:var(--muted);padding-left:18px;margin:0 0 12px}
.read-list li{margin-bottom:3px}
.links-row{display:flex;flex-wrap:wrap;gap:6px}
.links-row a{font-size:.82rem;padding:4px 10px;background:var(--accent-soft);color:var(--accent);border-radius:20px;text-decoration:none}
.links-row a:hover{opacity:.8}
.focus-box{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.focus-box h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-mono);margin-bottom:6px}
.focus-box ul{margin:0;padding-left:18px;font-size:.88rem}
.focus-box li{margin-bottom:3px}
.extra-box{margin-top:10px;padding:10px 14px;background:var(--ok-soft);border-left:3px solid var(--ok);border-radius:0 8px 8px 0;font-size:.88rem}

.quiz-wrap{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:16px}
.quiz-counter{font:.82rem var(--f-mono);color:var(--muted);margin-bottom:16px}
.quiz-q{font-weight:600;line-height:1.5;margin-bottom:18px;font-size:1.05rem}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);text-align:left;font-size:.95rem;transition:border-color .15s,background .15s;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.feedback{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:.9rem;line-height:1.55}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.ko{background:var(--ko-soft);border:1px solid var(--ko)}
.feedback strong{font-weight:700}
.quiz-nav{display:flex;justify-content:flex-end;margin-top:16px}
.btn{padding:10px 22px;border-radius:10px;border:0;font-weight:600;font-size:.95rem;cursor:pointer;transition:opacity .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.85}
.btn-ghost{background:var(--accent-soft);color:var(--accent)}
.btn-ghost:hover{opacity:.8}

.score-card{text-align:center;padding:32px 20px}
.score-big{font:700 3.5rem var(--f-mono);color:var(--accent)}
.score-label{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.score-bar-wrap{max-width:320px;margin:0 auto 20px;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.score-bar-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .6s}

.err-card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.err-meta{font:.78rem var(--f-mono);color:var(--muted);margin-bottom:6px}
.err-q{font-weight:600;font-size:.95rem;margin-bottom:8px}
.err-answer{font-size:.88rem;padding:8px 12px;border-radius:8px;margin-bottom:4px}
.err-answer.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.err-answer.ko{background:var(--ko-soft);border:1px solid var(--ko)}
.err-exp{font-size:.85rem;color:var(--muted);margin-top:6px}

.free-controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.select-wrap select{padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);font-size:.9rem}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;font:.7rem var(--f-mono);background:var(--ko);color:#fff;border-radius:9px;margin-left:5px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Certification 🐳</p>
      <h1 id="quizTitle">Docker DCA</h1>
    </div>
    <div class="stats">
      <div class="stat"><b class="num" id="statDone">0</b><span>répondues</span></div>
      <div class="stat"><b class="num" id="statOk">0 %</b><span>réussite</span></div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" id="tabPlan" aria-selected="true">Plan du jour</button>
    <button role="tab" id="tabQuiz" aria-selected="false">Quiz</button>
    <button role="tab" id="tabFree" aria-selected="false">Session libre</button>
    <button role="tab" id="tabErr" aria-selected="false">Mes erreurs<span id="errBadge" class="badge" hidden></span></button>
  </nav>
  <main id="view"></main>
</div>

<script src="questions.js"></script>
<script src="../engine/firebase-config.js"></script>
<script src="../engine/firebase.js"></script>
<script src="../engine/theme.js"></script>
<script src="../engine/quiz.js"></script>
</body>
</html>
